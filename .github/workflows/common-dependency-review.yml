name: Common Dependency Review (reusable)

# CI-046: review dependency changes on a pull request.
# The job is skipped when the caller event is not a pull request.

on:
  workflow_call:
    inputs:
      fail_on_severity:
        description: Lowest severity that fails the job
        required: false
        type: string
        default: high
      deny_licenses:
        description: SPDX licenses that fail the review. Empty skips the license deny list.
        required: false
        type: string
        default: ""
      allow_licenses:
        description: SPDX licenses that are allowed. Empty skips the allow list.
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: >-
    ${{ format('call-dependency-review-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail_on_severity }}
          deny-licenses: ${{ inputs.deny_licenses }}
          allow-licenses: ${{ inputs.allow_licenses }}
          comment-summary-in-pr: false
