# GHCR package visibility cannot be changed via API with GITHUB_TOKEN (PATCH → 404).
# There is also no API to grant "Manage Actions access". Print UI steps and fail.
name: GHCR Package Visibility

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Container package name under the owner (e.g. ci-lint)
        type: string
        required: true
        default: ci-lint

permissions:
  contents: read

jobs:
  instruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print manual UI steps (API cannot set visibility)
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          {
            echo "::error title=GHCR visibility is manual::API PATCH returns 404 for GITHUB_TOKEN; use the package settings UI."
            echo ""
            echo "Package: ghcr.io/${OWNER}/${PACKAGE}"
            echo "Settings: https://github.com/users/${OWNER}/packages/container/package/${PACKAGE}"
            echo ""
            echo "Make public:"
            echo "  1. Open Package settings → Change visibility → Public"
            echo ""
            echo "Or keep private and grant Actions pull access:"
            echo "  1. Package settings → Manage Actions access → Add repository"
            echo "  2. Add the consuming repo (e.g. ${OWNER}/containerdevops) with Read"
            echo ""
            echo "There is no REST API to change visibility or Actions access for user packages."
          } >&2
          exit 1
