# Make a GHCR package public using GITHUB_TOKEN (packages: write).
# Local `gh` often lacks packages scopes; run via workflow_dispatch.
name: GHCR Package Visibility

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Container package name under the owner (e.g. ci-base)
        type: string
        required: true
        default: ci-base
      visibility:
        description: public or private
        type: choice
        options:
          - public
          - private
        default: public

permissions:
  contents: read

jobs:
  set-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Set package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ inputs.package_name }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          echo "Setting ghcr.io/${OWNER}/${PACKAGE} visibility=${VISIBILITY}"
          # GITHUB_TOKEN is repo-scoped, not a user PAT — use /users or /orgs, not /user.
          OWNER_TYPE="$(gh api "users/${OWNER}" --jq .type)"
          echo "owner_type=${OWNER_TYPE}"
          if [[ "${OWNER_TYPE}" == "Organization" ]]; then
            API="orgs/${OWNER}/packages/container/${PACKAGE}"
          else
            API="users/${OWNER}/packages/container/${PACKAGE}"
          fi
          echo "GET ${API}"
          gh api -H "Accept: application/vnd.github+json" "${API}" \
            --jq '{name,visibility,package_type,html_url}'
          echo "PATCH visibility=${VISIBILITY}"
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "${API}" \
            -f visibility="${VISIBILITY}" \
            --jq '{name,visibility}'
          echo "Updated ${API} → visibility=${VISIBILITY}"
