name: Common Secrets + SAST (reusable)

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      working_directory:
        description: Directory to scan
        required: false
        type: string
        default: .
      scripts_ref:
        description: "Commit/tag/branch of commondevops to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      scripts_ref:
        type: string
        default: ""

permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  secrets-sast:
    # CI-024: skip when Dependabot cannot access Actions secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout commondevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _commondevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Install gitleaks
        working-directory: ${{ github.workspace }}
        env:
          INSTALL_ONLY: gitleaks
        run: bash _commondevops/scripts/install-common-tools.sh

      - name: gitleaks
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          CFG=""
          if [[ -f .gitleaks.toml ]]; then
            CFG="--config .gitleaks.toml"
          fi
          # shellcheck disable=SC2086
          gitleaks detect --source . --redact ${CFG}

      - name: Install semgrep
        working-directory: ${{ github.workspace }}
        run: |
          pipx install 'semgrep==1.172.0' || pip install --user 'semgrep==1.172.0'
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: semgrep
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          if [[ -f .semgrep.yml ]]; then
            semgrep scan --config auto --config .semgrep.yml --error .
          else
            semgrep scan --config auto --error .
          fi
