---
# Thin caller — CONTAINERDEVOPS_PIN: cc66d44fafc8b94f25ac57bbec0392de85da11e6
# PR #33 merge (single-platform DOCKER-TEST-002 verify)
# 1.0.0 after that release (PR3).
name: CI Base Image

on:
  release:
    types: [published]
  schedule:
    # Monthly on the 15th at 05:17 UTC (CI-027 rebuild cadence).
    - cron: "17 5 15 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-base/**"
      - ".github/workflows/ci-base-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025: default-deny at workflow level; jobs that call reusables grant scopes.
permissions:
  contents: read

jobs:
  lint:
    # Fork PRs lack secrets; Dependabot PRs cannot use Actions secrets (CI-024).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      # Nested container-lint → common-secrets-sast needs security-events: write.
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@cc66d44fafc8b94f25ac57bbec0392de85da11e6
    with:
      dockerfile: docker/ci-base/Dockerfile
      working_directory: .
      scripts_ref: cc66d44fafc8b94f25ac57bbec0392de85da11e6
      # Bootstrap: no ci-container yet; host install path.
      runner_image: ""
      # Nested infra uses commondevops@74695e83 (pre --min-severity); devops-ci covers infra.
      run_infra_lint: false
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      # Nested commondevops reusables: caller's own token.
      checkout_token: ${{ github.token }}
      # Sparse-checkout of private containerdevops scripts/.
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@cc66d44fafc8b94f25ac57bbec0392de85da11e6
    with:
      context: docker/ci-base
      dockerfile: docker/ci-base/Dockerfile
      image_name: ci-base:ci
      structure_test_config: docker/ci-base/container-structure-test.yml
      scripts_ref: cc66d44fafc8b94f25ac57bbec0392de85da11e6
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      image_max_size_mb: "1500"
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@cc66d44fafc8b94f25ac57bbec0392de85da11e6
    with:
      image: ci-base:ci
      image_artifact: container-image
      scripts_ref: cc66d44fafc8b94f25ac57bbec0392de85da11e6
      pkg_types: library
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    # Release / monthly schedule / dispatch+publish only — no push-to-main publish.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@cc66d44fafc8b94f25ac57bbec0392de85da11e6
    with:
      context: docker/ci-base
      dockerfile: docker/ci-base/Dockerfile
      image_name: ci-base
      scripts_ref: cc66d44fafc8b94f25ac57bbec0392de85da11e6
      platforms: linux/amd64
      # Private Free-plan repos cannot use artifact attestations; enable when public.
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
