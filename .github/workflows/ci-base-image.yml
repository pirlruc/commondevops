---
# Thin caller — CONTAINERDEVOPS_PIN: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
# Pin predates runner_image; container-lint at this SHA has no container: key (bare ubuntu).
# After containerdevops merges runner_image / tag_latest, bump this pin.
name: CI Base Image

on:
  # TEMP (bootstrap): release/schedule/PR triggers disabled while containerdevops
  # CI is stabilized. Restore release:[published], monthly schedule, and path-filtered
  # pull_request after containerdevops PR #21 is green/merged.
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025: default-deny at workflow level; jobs that call reusables grant scopes.
permissions:
  contents: read

jobs:
  lint:
    # Fork PRs lack secrets; Dependabot PRs cannot use Actions secrets (CI-024).
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
    with:
      dockerfile: docker/ci-base/Dockerfile
      working_directory: .
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
    with:
      context: docker/ci-base
      dockerfile: docker/ci-base/Dockerfile
      image_name: ci-base:ci
      structure_test_config: docker/ci-base/container-structure-test.yml
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
    with:
      image: ci-base:ci
      image_artifact: container-image
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      pkg_types: library
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    # Release / monthly schedule / dispatch+publish only — no push-to-main publish.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
    with:
      context: docker/ci-base
      dockerfile: docker/ci-base/Dockerfile
      image_name: ci-base
      scripts_ref: 4185836ce6ea925e38d9b93c281b4ef8cf77c2d2
      platforms: linux/amd64
      # Private Free-plan repos cannot use artifact attestations; enable when public.
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      # After CONTAINERDEVOPS_PIN gains tag_latest, add:
      # tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
