name: Common Scaffold Verify (reusable)

# github-scaffold-specific checks against the caller tree. Does not clone
# pirlruc/guardrails and does not require GUARDRAILS_READ_TOKEN.
# Skips each check when the corresponding caller script is absent.

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of commondevops matching the uses: pin"
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        description: Token to read this repo when the done-vs-open script is checked out cross-repo
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""

# CI-025: default-deny; jobs grant the minimum they need.
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}


env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  verify:
    # Token-free checks run on Dependabot PRs (CMN-RECON-001 / CI-024).
    # The done-vs-open lookup is a later step and stays skipped for Dependabot.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout hashed scaffold requirements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _commondevops
          sparse-checkout: |
            scripts/scaffold-requirements.txt
            scripts/check-done-open.py
          sparse-checkout-cone-mode: false

      - name: issues-sync --validate-only
        id: issues
        continue-on-error: true
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
        run: |
          if [ -n "${SCRIPTS_REF}" ]; then
            echo "scripts_ref=${SCRIPTS_REF} (must match caller uses: pin)"
          fi
          sync=scripts/issues-sync.py
          if [ ! -f "${sync}" ]; then
            sync=.github/scaffold/scripts/issues-sync.py
          fi
          if [ ! -f "${sync}" ]; then
            echo "note: issues-sync.py not in scripts/ or .github/scaffold/scripts/; skipping --validate-only"
            exit 0
          fi
          if [ ! -f docs/issues.yml ]; then
            echo "note: docs/issues.yml not in caller; skipping --validate-only"
            exit 0
          fi
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q --require-hashes -r _commondevops/scripts/scaffold-requirements.txt
          .ci-venv/bin/python "${sync}" --yaml docs/issues.yml --validate-only

      - name: SCAFFOLD_REF default matches newest tag
        id: scaffold_ref
        continue-on-error: true
        run: |
          setup=scripts/setup-library-submodules.sh
          if [ ! -f "${setup}" ]; then
            setup=.github/scaffold/scripts/setup-library-submodules.sh
          fi
          if [ ! -f "${setup}" ]; then
            echo "note: setup-library-submodules.sh not in scripts/ or .github/scaffold/scripts/; skipping SCAFFOLD_REF check"
            exit 0
          fi
          newest="$(git describe --tags --abbrev=0)"
          default="$(grep -E '^SCAFFOLD_REF=' "${setup}" | sed 's/.*:-\([^}]*\)}.*/\1/')"
          if [ -z "${default}" ]; then
            echo "error: could not parse SCAFFOLD_REF default from setup-library-submodules.sh" >&2
            exit 1
          fi
          echo "SCAFFOLD_REF default=${default} newest tag=${newest}"
          test "${default}" = "${newest}"

      - name: Checkout done-vs-open script
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _commondevops
          sparse-checkout: |
            scripts/check-done-open.py
            scripts/scaffold-requirements.txt
          sparse-checkout-cone-mode: false

      - name: Done manifest ids are not still open
        id: recon
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x .ci-venv/bin/python ]; then
            python3 -m venv .ci-venv
            .ci-venv/bin/pip install -q --require-hashes -r _commondevops/scripts/scaffold-requirements.txt
          fi
          .ci-venv/bin/python _commondevops/scripts/check-done-open.py docs/issues.yml

      - name: Gate — scaffold
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          ISSUES: ${{ steps.issues.outcome }}
          SCAFFOLD: ${{ steps.scaffold_ref.outcome }}
          RECON: ${{ steps.recon.outcome }}
        run: |
          failed=""
          [ "${ISSUES}" = "success" ] || [ "${ISSUES}" = "skipped" ] || failed="${failed} issues(${ISSUES})"
          [ "${SCAFFOLD}" = "success" ] || [ "${SCAFFOLD}" = "skipped" ] || failed="${failed} scaffold_ref(${SCAFFOLD})"
          [ "${RECON}" = "success" ] || [ "${RECON}" = "skipped" ] || [ -z "${RECON}" ] || failed="${failed} recon(${RECON})"
          if [ -z "${failed}" ]; then
            echo "All collected gates passed."
            exit 0
          fi
          echo "Collected gate failures:${failed}"
          if [ "${ADVISORY}" = "true" ]; then
            echo "advisory — not failing the job (pass blocking=true to enforce findings)."
            exit 0
          fi
          echo "::error::Quality gates failed:${failed}"
          exit 1
