name: Common OpenSSF Scorecard (reusable)

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      publish_results:
        description: Publish Scorecard results to OpenSSF API / code scanning
        required: false
        type: boolean
        default: true
    secrets:
      repo_token:
        description: PAT with repo scope for private-repo Scorecard (ListCommits)
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      publish_results:
        type: boolean
        default: true

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-scorecard-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}


env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  scorecard:
    # Skip forks and Dependabot (CI-024); Scorecard needs id-token on the default branch.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}
          repo_token: ${{ secrets.repo_token }}

      - name: Gate — scorecard
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          SCORECARD: ${{ steps.scorecard.outcome }}
        run: |
          set -euo pipefail
          if [[ "${SCORECARD}" == "skipped" || "${SCORECARD}" == "cancelled" || "${SCORECARD}" == "success" ]]; then
            echo "All collected gates passed."
            exit 0
          fi
          echo "Collected gate failures: scorecard(${SCORECARD})"
          if [[ "${ADVISORY}" == "true" ]]; then
            echo "advisory — not failing the job (pass blocking=true to enforce findings)."
            exit 0
          fi
          echo "::error::Quality gates failed: scorecard(${SCORECARD})"
          exit 1

      - name: Upload Scorecard SARIF artifact
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: common-scorecard-sarif
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 1

  upload-sarif:
    needs: scorecard
    if: always() && needs.scorecard.result != 'skipped' && needs.scorecard.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      security-events: write
    steps:
      - name: Download Scorecard SARIF
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: common-scorecard-sarif
          path: scorecard-results
      - name: Upload Scorecard SARIF
        if: hashFiles('scorecard-results/results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results/results.sarif
          category: openssf-scorecard
