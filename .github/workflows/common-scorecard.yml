name: Common OpenSSF Scorecard (reusable)

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      publish_results:
        description: Publish Scorecard results to OpenSSF API / code scanning
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      publish_results:
        type: boolean
        default: true

permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  scorecard:
    # Skip forks and Dependabot (CI-024); Scorecard needs id-token on the default branch.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        id: scorecard
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      - name: Upload Scorecard SARIF
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
