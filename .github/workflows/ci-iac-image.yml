---
# Publishes ghcr.io/pirlruc/ci-iac (+ Docker Hub when secrets are set).
# Debian only. OpenTofu, tflint, sops, age, and ansible-lint are not on ci-lint.
# containerdevops pin: tag 6.3.5 (handoff_package + digest).
name: CI IaC Image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 15 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-iac/**"
      - ".github/workflows/ci-iac-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR/Hub (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      dockerfile: docker/ci-iac/Dockerfile
      working_directory: .
      scripts_ref: c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ github.token }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      context: docker/ci-iac
      dockerfile: docker/ci-iac/Dockerfile
      image_name: ci-iac:ci
      artifact_name: container-image-ci-iac
      handoff_package: ci-iac
      structure_test_config: docker/ci-iac/container-structure-test.yml
      scripts_ref: c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      image_title: ci-iac
      image_description: >-
        Short-lived CI image for OpenTofu, tflint, sops, age, and ansible-lint.
        Debian 13. Non-root 1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-results-ci-iac
      sarif_category: trivy-ci-iac
      scripts_ref: c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
      pkg_types: library
      ignorefile: docker/ci-iac/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-posture:
    needs: build
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-posture-ci-iac
      sarif_category: trivy-posture-ci-iac
      scripts_ref: c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      context: docker/ci-iac
      dockerfile: docker/ci-iac/Dockerfile
      image_name: ci-iac
      dockerhub_image: pirlruc/ci-iac
      scripts_ref: c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
      platforms: linux/amd64
      tag_suffix: ""
      tag_alias_unsuffixed: false
      image_title: ci-iac
      image_description: >-
        Short-lived CI image for OpenTofu, tflint, sops, age, and ansible-lint.
        Debian 13. Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-iac
      image_url: https://hub.docker.com/r/pirlruc/ci-iac
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-iac.md
      dockerhub_short_description: >-
        CI image for OpenTofu, tflint, sops, age, and ansible-lint
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # Inlined from container-handoff-cleanup. GitHub returns 400 when the
  # ci-run tag is the package's only version, which is true for the first
  # ci-iac pull request. That case is not a failed cleanup.
  cleanup:
    needs: [build, scan]
    if: always() && github.event_name == 'pull_request' && needs.build.outputs.handoff_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Delete ephemeral GHCR tag version
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ needs.build.outputs.handoff_package }}
          TAG: ${{ needs.build.outputs.handoff_tag }}
        run: |
          set -euo pipefail
          enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "${PKG}")"
          set +e
          ids="$(gh api --paginate "/users/${OWNER}/packages/container/${enc}/versions" \
            --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" 2>versions.err)"
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            if grep -q 'HTTP 404' versions.err; then
              echo "no package ${OWNER}/${PKG} — nothing to delete"
              exit 0
            fi
            cat versions.err >&2
            echo "error: listing ${OWNER}/${PKG} versions failed" >&2
            exit 1
          fi
          if [[ -z "${ids}" ]]; then
            echo "no version found for ${OWNER}/${PKG}:${TAG}"
            exit 0
          fi
          while IFS= read -r id; do
            [[ -z "${id}" ]] && continue
            tags="$(gh api "/users/${OWNER}/packages/container/${enc}/versions/${id}" \
              --jq '[.metadata.container.tags[]?] | join(",")')"
            extra="$(printf '%s' "${tags}" | tr ',' '\n' | grep -v -e "^${TAG}$" -e '^$' || true)"
            if [[ -n "${extra}" ]]; then
              echo "refusing to delete version ${id} — also tagged: ${extra}"
              continue
            fi
            echo "deleting ${OWNER}/${PKG} version ${id} (tag ${TAG})"
            set +e
            gh api -X DELETE "/users/${OWNER}/packages/container/${enc}/versions/${id}" 2>delete.err
            rc=$?
            set -e
            if [[ "${rc}" -ne 0 ]]; then
              if grep -q 'last tagged version' delete.err; then
                echo "leaving the only version of ${OWNER}/${PKG}"
                continue
              fi
              cat delete.err >&2
              exit 1
            fi
          done <<< "${ids}"
