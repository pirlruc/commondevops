name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      blocking: true
      publish_results: false

  # Optional note: published-image rescan of ghcr.io/pirlruc/ci-base:latest can be
  # wired once the package exists (Trivy image scan). Skipped here until ci-base
  # is published — no container-scan reusable in this repo.
  published-image-rescan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Note — ci-base image rescan
        run: |
          cat <<'EOF'
          Scheduled security lane covers secrets/SAST, supply-chain (SBOM + license),
          and Scorecard. A Trivy rescan of ghcr.io/pirlruc/ci-base:latest will be
          added after the package is published (CI-027 monthly rebuild also rescans
          on the image publish path).
          EOF
