name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: ./.github/workflows/common-token-audit.yml
    with:
      scripts_ref: ${{ github.sha }}
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-lint-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e
    with:
      image: ghcr.io/pirlruc/ci-lint:6.10.1@sha256:9e3fa55713747600a8088912d9fd92366eeaf63e01902c9de3d550a0edde58a6
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      results_artifact: published-ci-lint-scan
      sarif_category: trivy-ci-lint-debian
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-lint-rescan-alpine:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-lint:6.10.1-alpine@sha256:583bc61a4b9a02d9ab55f4c33f3f8d8c4e22f36426c738d15d2e2d249f96659c
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      results_artifact: published-ci-lint-scan-alpine
      sarif_category: trivy-ci-lint-alpine
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.10.1@sha256:3cd91af0e57827678edbe04d967eb515dde12f9dc532f990829b320f5db07261
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      results_artifact: published-ci-supply-chain-scan
      sarif_category: trivy-ci-supply-chain-alpine
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-rescan-debian:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.10.1-debian@sha256:4201515dd229bba26a4b275370f47f4c6ae7df52778408b0277336ee38c810ef
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      results_artifact: published-ci-supply-chain-scan-debian
      sarif_category: trivy-ci-supply-chain-debian
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-iac-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e
    with:
      image: ghcr.io/pirlruc/ci-iac:6.10.1@sha256:828cbe098f1f90347a2702ad08dc21aa7d47e60e31084dcc290ece80e660f636
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: library
      ignorefile: docker/ci-iac/.trivyignore.yaml
      results_artifact: published-ci-iac-scan
      sarif_category: trivy-ci-iac
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # Advisory OS scans. The category names match the image workflows, so a
  # default-branch run closes alerts that a tag upload cannot.
  published-ci-lint-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-lint:6.10.1@sha256:9e3fa55713747600a8088912d9fd92366eeaf63e01902c9de3d550a0edde58a6
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-lint-posture-debian
      sarif_category: trivy-ci-lint-posture-debian
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-lint-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-lint:6.10.1-alpine@sha256:583bc61a4b9a02d9ab55f4c33f3f8d8c4e22f36426c738d15d2e2d249f96659c
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-lint-posture-alpine
      sarif_category: trivy-ci-lint-posture-alpine
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.10.1@sha256:3cd91af0e57827678edbe04d967eb515dde12f9dc532f990829b320f5db07261
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-supply-chain-posture-alpine
      sarif_category: trivy-ci-supply-chain-posture-alpine
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@ae9dbee9e4537bd3a0b533de3bad011cb44b201e # 6.8.0
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.10.1-debian@sha256:4201515dd229bba26a4b275370f47f4c6ae7df52778408b0277336ee38c810ef
      scripts_ref: ae9dbee9e4537bd3a0b533de3bad011cb44b201e
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-supply-chain-posture-debian
      sarif_category: trivy-ci-supply-chain-posture-debian
      blocking: false
    secrets:
