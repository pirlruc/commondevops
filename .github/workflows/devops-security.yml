name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: ./.github/workflows/common-token-audit.yml
    with:
      scripts_ref: ${{ github.sha }}
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      checkout_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-lint-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216
    with:
      image: ghcr.io/pirlruc/ci-lint:6.8.0@sha256:3ed6d8dcbb08abf82e563630f2c1218cf0e8f33bb883ed46770e147113af48b0
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      results_artifact: published-ci-lint-scan
      sarif_category: trivy-ci-lint
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.8.0@sha256:07518afbf12aa3e2aeeb1e220e2dcb3a633e2d8c1583a60612f30855970a1008
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      results_artifact: published-ci-supply-chain-scan
      sarif_category: trivy-ci-supply-chain
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-iac-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216
    with:
      image: ghcr.io/pirlruc/ci-iac:6.8.0@sha256:2587b50fbec0c68bf19ae56cf4f7ea07b2af49a3db3472c885678f927c1ba2b6
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: library
      ignorefile: docker/ci-iac/.trivyignore.yaml
      results_artifact: published-ci-iac-scan
      sarif_category: trivy-ci-iac
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # Advisory OS scans. The category names match the image workflows, so a
  # default-branch run closes alerts that a tag upload cannot.
  published-ci-lint-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216 # 6.7.0
    with:
      image: ghcr.io/pirlruc/ci-lint:6.8.0@sha256:3ed6d8dcbb08abf82e563630f2c1218cf0e8f33bb883ed46770e147113af48b0
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-lint-posture-debian
      sarif_category: trivy-ci-lint-posture-debian
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-lint-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216 # 6.7.0
    with:
      image: ghcr.io/pirlruc/ci-lint:6.8.0-alpine@sha256:adaa142df825e1532a799f57004d969fb2899a41d6c2b768ed06c6ded1099007
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-lint-posture-alpine
      sarif_category: trivy-ci-lint-posture-alpine
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216 # 6.7.0
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.8.0@sha256:07518afbf12aa3e2aeeb1e220e2dcb3a633e2d8c1583a60612f30855970a1008
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-supply-chain-posture-alpine
      sarif_category: trivy-ci-supply-chain-posture-alpine
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216 # 6.7.0
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:6.8.0-debian@sha256:cceea28e7719138294d11396fa3b9ebdb078d5997de6b4454b9e3f14e33d5133
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-supply-chain-posture-debian
      sarif_category: trivy-ci-supply-chain-posture-debian
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-iac-posture:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@f0f9077ced9f79097e7597de1a2e00f8eb42e216 # 6.7.0
    with:
      image: ghcr.io/pirlruc/ci-iac:6.8.0@sha256:2587b50fbec0c68bf19ae56cf4f7ea07b2af49a3db3472c885678f927c1ba2b6
      scripts_ref: f0f9077ced9f79097e7597de1a2e00f8eb42e216
      pkg_types: os,library
      ignorefile: none
      results_artifact: published-ci-iac-posture
      sarif_category: trivy-posture-ci-iac
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
