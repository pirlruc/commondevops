name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  published-ci-lint-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@c01b12a999ab2f17bc7352e2611d36a68e55a08e
    with:
      image: ghcr.io/pirlruc/ci-lint:5.2.0@sha256:33dbcc7be28ffef2a6cf3cf4b611cf862a8f246c6d6932c4055772d73d697674
      scripts_ref: c01b12a999ab2f17bc7352e2611d36a68e55a08e
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      results_artifact: published-ci-lint-scan
      sarif_category: trivy-ci-lint
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@c01b12a999ab2f17bc7352e2611d36a68e55a08e
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:5.2.0@sha256:f880c137677d703ec84ab0f386ceb0363d9e69aaf77bc3da40c0644dd7d9c784
      scripts_ref: c01b12a999ab2f17bc7352e2611d36a68e55a08e
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      results_artifact: published-ci-supply-chain-scan
      sarif_category: trivy-ci-supply-chain
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
