name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: ./.github/workflows/common-token-audit.yml
    secrets:
      scorecard_token: ${{ secrets.SCORECARD_TOKEN }}

  published-ci-lint-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@2ad052e69d2587cdaf8ccac59b9dae5c60f5560b
    with:
      image: ghcr.io/pirlruc/ci-lint:5.2.4@sha256:e0a51c64b004c6f4e4ca1672f3bb865aaf03d91bd8a2e228e0fa39be1174dfb4
      scripts_ref: 2ad052e69d2587cdaf8ccac59b9dae5c60f5560b
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      results_artifact: published-ci-lint-scan
      sarif_category: trivy-ci-lint
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-rescan:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-published-rescan.yml@2ad052e69d2587cdaf8ccac59b9dae5c60f5560b
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:5.2.4@sha256:f7abb77fd31aeb68bf31ff391ed0e54825f706314607dc1570088e19d3d6c55c
      scripts_ref: 2ad052e69d2587cdaf8ccac59b9dae5c60f5560b
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      results_artifact: published-ci-supply-chain-scan
      sarif_category: trivy-ci-supply-chain
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
