name: DevOps Security (scheduled)

on:
  schedule:
    # Monday 06:17 UTC — staggered off the hour (CI-002 / OpenSSF weekly Scorecard cadence).
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  secrets-sast:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: true
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: true
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  published-ci-lint-probe:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: probe
        run: |
          if docker pull ghcr.io/pirlruc/ci-lint:latest; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ci-lint:latest not pullable yet; rescan will skip"
          fi

  published-ci-lint-rescan:
    needs: published-ci-lint-probe
    if: github.actor != 'dependabot[bot]' && needs.published-ci-lint-probe.outputs.present == 'true'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@ea908fd0feb87ab6615b71f5af1cce0637a6567b
    with:
      image: ghcr.io/pirlruc/ci-lint:latest
      scripts_ref: ea908fd0feb87ab6615b71f5af1cce0637a6567b
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  published-ci-supply-chain-probe:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: probe
        run: |
          if docker pull ghcr.io/pirlruc/ci-supply-chain:latest; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ci-supply-chain:latest not pullable yet; rescan will skip"
          fi

  published-ci-supply-chain-rescan:
    needs: published-ci-supply-chain-probe
    if: github.actor != 'dependabot[bot]' && needs.published-ci-supply-chain-probe.outputs.present == 'true'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@ea908fd0feb87ab6615b71f5af1cce0637a6567b
    with:
      image: ghcr.io/pirlruc/ci-supply-chain:latest
      scripts_ref: ea908fd0feb87ab6615b71f5af1cce0637a6567b
      pkg_types: library
      ignorefile: docker/ci-supply-chain/.trivyignore.yaml
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
