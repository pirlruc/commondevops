name: Common Dependabot metadata (reusable)

# Summarize a Dependabot pull request. Maintainer pull requests skip this job.
# The author id is checked because login alone is spoofable.

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Dependabot metadata (reusable)'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-dependabot-metadata-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Dependabot metadata (reusable)' }}

jobs:
  metadata:
    name: Summarize Dependabot dependency update
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Summarize dependency update
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
        run: |-
          {
            echo "## Dependabot update"
            echo
            echo "- Dependency names: ${DEPENDENCY_NAMES}"
            echo "- Dependency type: ${DEPENDENCY_TYPE}"
            echo "- Update type: ${UPDATE_TYPE}"
            echo "- Package ecosystem: ${PACKAGE_ECOSYSTEM}"
            echo "- Directory: ${DIRECTORY}"
          } >> "$GITHUB_STEP_SUMMARY"
