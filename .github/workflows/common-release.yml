name: Common Release (reusable)

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.2.3)
        required: true
        type: string
      attach_sbom:
        description: Attach SBOM artifacts from a prior common-supply-chain run if present
        required: false
        type: boolean
        default: false
      sign:
        description: >-
          Keyless cosign sign-blob plus a GitHub build-provenance attestation.
          Needs a public repository. Private Free-plan callers leave this false.
        required: false
        type: boolean
        default: false
      environment:
        description: >-
          GitHub Environment for this job. Empty runs with no environment.
          Callers that publish from a tag put release secrets in an environment
          limited to tag refs (REL-PUB-004).
        required: false
        type: string
        default: ""
      sbom_artifact:
        description: Artifact name containing SBOM files when attach_sbom is true
        required: false
        type: string
        default: common-supply-chain-results
      release_artifact:
        description: >-
          Name of an artifact uploaded earlier in this workflow run. Empty
          skips the download. Each attached file also gets a .sha256 asset.
        required: false
        type: string
        default: ""
      release_files:
        description: >-
          Newline-separated paths or basenames inside release_artifact.
          Empty attaches every file. A name that is missing fails the job.
          Existing .sha256 files in the artifact are ignored; checksums are
          regenerated.
        required: false
        type: string
        default: ""
    secrets:
      release_token:
        description: >-
          PAT used for gh release create. Prefer a PAT over github.token so the
          published release fires on: release workflows in this and other repos.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      attach_sbom:
        type: boolean
        default: false
      sign:
        type: boolean
        default: false
      sbom_artifact:
        type: string
        default: common-supply-chain-results
      release_artifact:
        type: string
        default: ""
      release_files:
        type: string
        default: ""
      environment:
        type: string
        default: ""

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Release (reusable)'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Release (reusable)' }}


jobs:
  release:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      # Requested when sign=true (keyless cosign / attest); unused otherwise.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^(v)?[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '${TAG}' must match semver-ish [v]MAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' not found in this repository"
            exit 1
          fi
          echo "Tag ${TAG} OK → $(git rev-list -n1 "${TAG}")"

      - name: Download SBOM artifact
        if: inputs.attach_sbom
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sbom_artifact }}
          path: sbom-attach

      - name: Download release artifact
        if: inputs.release_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_artifact }}
          path: release-attach

      - name: Select release files and write checksums
        if: inputs.release_artifact != ''
        env:
          RELEASE_FILES: ${{ inputs.release_files }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          declare -A wanted=()
          if [[ -n "${RELEASE_FILES}" ]]; then
            while IFS= read -r name || [[ -n "${name}" ]]; do
              name="${name#"${name%%[![:space:]]*}"}"
              name="${name%"${name##*[![:space:]]}"}"
              [[ -z "${name}" || "${name}" == \#* ]] && continue
              wanted["${name}"]=0
            done <<< "${RELEASE_FILES}"
          fi
          while IFS= read -r -d '' src; do
            rel="${src#release-attach/}"
            base="$(basename "${src}")"
            [[ "${base}" == *.sha256 ]] && continue
            take=0
            if [[ -z "${RELEASE_FILES}" ]]; then
              take=1
            elif [[ -v wanted["${rel}"] || -v wanted["${base}"] ]]; then
              take=1
              wanted["${rel}"]=1
              wanted["${base}"]=1
            fi
            [[ "${take}" -eq 0 ]] && continue
            if [[ -e "release-out/${base}" ]]; then
              echo "::error::duplicate file name ${base} in the release artifact"
              exit 1
            fi
            cp "${src}" "release-out/${base}"
          done < <(find release-attach -type f -print0)
          if [[ -n "${RELEASE_FILES}" ]]; then
            for name in "${!wanted[@]}"; do
              if [[ "${wanted[${name}]}" -eq 0 ]]; then
                echo "::error::${name} is not in the release artifact"
                exit 1
              fi
            done
          fi
          shopt -s nullglob
          found=(release-out/*)
          if ((${#found[@]} == 0)); then
            echo "::error::release artifact produced no files"
            exit 1
          fi
          for file in "${found[@]}"; do
            base="$(basename "${file}")"
            ( cd release-out && sha256sum "${base}" > "${base}.sha256" )
          done

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release blobs
        if: inputs.sign
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-out/* sbom-attach/*)
          signed=0
          for file in "${files[@]}"; do
            [[ -f "${file}" ]] || continue
            [[ "${file}" == *.sigstore.json ]] && continue
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
            signed=1
          done
          if [[ "${signed}" -eq 0 ]]; then
            echo "::error::sign=true but the release has no files to sign"
            exit 1
          fi

      - name: List attested subjects
        id: subjects
        if: inputs.sign
        run: |
          set -euo pipefail
          shopt -s nullglob
          {
            echo "paths<<EOF"
            for file in release-out/* sbom-attach/*; do
              [[ -f "${file}" ]] || continue
              [[ "${file}" == *.sigstore.json ]] && continue
              echo "${file}"
            done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        if: inputs.sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Create GitHub Release
        env:
          RELEASE_TOKEN: ${{ secrets.release_token }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ATTACH_SBOM: ${{ inputs.attach_sbom }}
          RELEASE_ARTIFACT: ${{ inputs.release_artifact }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "::warning::release_token secret not provided — creating the release with github.token. Releases created with GITHUB_TOKEN do not fire on: release workflows. Pass secrets.release_token (PAT with contents:write) when callers need the release event chain."
            export GH_TOKEN="${GITHUB_TOKEN_FALLBACK}"
          else
            export GH_TOKEN="${RELEASE_TOKEN}"
          fi
          ARGS=(release create "${TAG}" --generate-notes)
          shopt -s nullglob
          if [[ "${ATTACH_SBOM}" == "true" ]]; then
            files=(sbom-attach/*)
            if ((${#files[@]})); then
              ARGS+=("${files[@]}")
            fi
          fi
          if [[ -n "${RELEASE_ARTIFACT}" ]]; then
            assets=(release-out/*)
            if ((${#assets[@]} == 0)); then
              echo "::error::release artifact produced no files"
              exit 1
            fi
            ARGS+=("${assets[@]}")
          fi
          gh "${ARGS[@]}"
