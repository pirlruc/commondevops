name: Common CodeQL (reusable)

# Generic CodeQL analysis. The caller names the languages. A private
# repository without code scanning sets run_codeql false.

on:
  workflow_call:
    inputs:
      languages:
        description: Comma-separated CodeQL languages, such as actions
        required: true
        type: string
      queries:
        description: CodeQL query suite
        required: false
        type: string
        default: security-extended
      run_codeql:
        description: Set false when the repository has no code scanning
        required: false
        type: boolean
        default: true
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
    secrets:
      checkout_token:
        description: Caller checkout token. Empty uses GITHUB_TOKEN.
        required: false
  workflow_dispatch:
    inputs:
      languages:
        type: string
        default: actions
      queries:
        type: string
        default: security-extended
      run_codeql:
        type: boolean
        default: true
      runs_on:
        type: string
        default: '"ubuntu-24.04"'

permissions: {}

jobs:
  analyze:
    if: >-
      inputs.run_codeql &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    name: CodeQL
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.checkout_token || github.token }}

      - name: Initialize CodeQL
        # codeql-action v4.39.3
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Analyze
        # codeql-action v4.39.3
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
