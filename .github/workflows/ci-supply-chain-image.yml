---
# Thin caller — publishes ghcr.io/pirlruc/ci-supply-chain (+ Docker Hub when secrets set).
name: CI Supply Chain Image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 15 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-supply-chain/**"
      - ".github/workflows/ci-supply-chain-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR/Hub (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@3a7cac1c67f2a2755750440a39175ff4d438f211
    with:
      dockerfile: docker/ci-supply-chain/Dockerfile
      working_directory: .
      scripts_ref: 3a7cac1c67f2a2755750440a39175ff4d438f211
      runner_image: ""
      run_infra_lint: false
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ github.token }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@3a7cac1c67f2a2755750440a39175ff4d438f211
    with:
      context: docker/ci-supply-chain
      dockerfile: docker/ci-supply-chain/Dockerfile
      image_name: ci-supply-chain:ci
      structure_test_config: docker/ci-supply-chain/container-structure-test.yml
      scripts_ref: 3a7cac1c67f2a2755750440a39175ff4d438f211
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      # Rootfs ~575 MB measured via du -sxm /; headroom for base churn.
      image_max_size_mb: "700"
      image_title: ci-supply-chain
      image_description: >-
        Short-lived CI toolchain image for SBOM generation and
        vulnerability/license gates: syft, grype, trivy, grant. Non-root
        1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@3a7cac1c67f2a2755750440a39175ff4d438f211
    with:
      image: ci-supply-chain:ci
      image_artifact: container-image
      scripts_ref: 3a7cac1c67f2a2755750440a39175ff4d438f211
      pkg_types: library
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-posture:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@3a7cac1c67f2a2755750440a39175ff4d438f211
    with:
      image: ci-supply-chain:ci
      image_artifact: container-image
      scripts_ref: 3a7cac1c67f2a2755750440a39175ff4d438f211
      pkg_types: os,library
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@3a7cac1c67f2a2755750440a39175ff4d438f211
    with:
      context: docker/ci-supply-chain
      dockerfile: docker/ci-supply-chain/Dockerfile
      image_name: ci-supply-chain
      dockerhub_image: pirlruc/ci-supply-chain
      scripts_ref: 3a7cac1c67f2a2755750440a39175ff4d438f211
      platforms: linux/amd64
      image_title: ci-supply-chain
      image_description: >-
        Short-lived CI toolchain image for SBOM generation and
        vulnerability/license gates: syft, grype, trivy, grant. Non-root
        1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-supply-chain
      image_url: https://hub.docker.com/r/pirlruc/ci-supply-chain
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-supply-chain.md
      dockerhub_short_description: >-
        CI toolchain: syft, grype, trivy, grant for SBOM and vulnerability/license gates
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
