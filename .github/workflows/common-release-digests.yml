name: Common Release Digests (reusable)

# REL-PUB-005. Called after an image publish on release: published.

on:
  workflow_call:
    inputs:
      images:
        description: Space-separated image refs to inspect
        required: true
        type: string
      scripts_ref:
        description: >-
          commondevops revision that contains scripts/append-release-digests.sh.
          A cross-repo caller must set this to the same SHA as uses (CI-034).
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  digests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Require scripts_ref from another repository
        if: github.repository != 'pirlruc/commondevops' && inputs.scripts_ref == ''
        run: |
          echo "a cross-repo caller must pass scripts_ref equal to the uses pin (CI-034)" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: ${{ inputs.scripts_ref != '' && inputs.scripts_ref || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/append-release-digests.sh
          sparse-checkout-cone-mode: false
      - name: Append digest table
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          IMAGES: ${{ inputs.images }}
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -eu
          # shellcheck disable=SC2086
          sh scripts/append-release-digests.sh ${IMAGES}
