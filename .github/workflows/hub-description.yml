# Push Docker Hub Overviews without rebuilding images.
# Push to main when a Hub page changes. workflow_dispatch remains.
# A release event republishes images, so this workflow does not listen for it.

name: Hub description

on:
  push:
    branches: [main]
    paths:
      - "docs/docker-hub*.md"
      - ".github/workflows/hub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-lint:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      dockerhub_image: pirlruc/ci-lint
      dockerhub_readme: docs/docker-hub-ci-lint.md
      dockerhub_short_description: >-
        CI toolchain: actionlint, hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

  ci-supply-chain:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      dockerhub_image: pirlruc/ci-supply-chain
      dockerhub_readme: docs/docker-hub-ci-supply-chain.md
      dockerhub_short_description: >-
        CI toolchain: syft, grype, trivy, grant for SBOM and vulnerability/license gates
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}

  ci-iac:
    permissions:
      contents: read
    uses: pirlruc/containerdevops/.github/workflows/container-hub-description.yml@c92c83bd4ccb9f0040f11ca9e99bc1b4f50b652e
    with:
      dockerhub_image: pirlruc/ci-iac
      dockerhub_readme: docs/docker-hub-ci-iac.md
      dockerhub_short_description: >-
        CI image for OpenTofu, tflint, sops, age, and ansible-lint
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
