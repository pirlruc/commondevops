name: Common Supply Chain (reusable)

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      working_directory:
        description: Directory to scan (Syft dir source)
        required: false
        type: string
        default: .
      license_deny_list:
        description: JSON array of SPDX license substrings to deny (empty → guardrails thresholds)
        required: false
        type: string
        default: "[]"
      license_engine:
        description: "License evaluator: grant (default) or spdx-deny (license_gate.py)"
        required: false
        type: string
        default: grant
      scripts_ref:
        description: "Commit/tag/branch of commondevops to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      results_retention_days:
        description: Retention for the SBOM and scan artifact. The release attach happens in the same run.
        required: false
        type: number
        default: 1
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      license_deny_list:
        type: string
        default: "[]"
      license_engine:
        type: string
        default: grant
      scripts_ref:
        type: string
        default: ""

# CI-025 / CI-042: the scan job does not upload SARIF. The upload job is
# the only one with security-events: write.
permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-supply-chain-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}


env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  supply-chain:
    # CI-024
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # Private package. Debian ci-supply-chain 5.3.3 (CI-028). The SARIF job stays on the runner.
    container:
      image: ghcr.io/pirlruc/ci-supply-chain@sha256:c4319ff77a65c1223f214ca27c545a1bc81da023ea0ee33a697fc817c54c2099
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The published image has no git. Mount the runner git and the
      # libcurl-gnutls closure git-remote-https needs. Leave libc and libssl
      # on the image copies.
      options: >-
        --user root
        -v /usr/bin/git:/usr/bin/git:ro
        -v /usr/lib/git-core:/usr/lib/git-core:ro
        -v /usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4:/usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4:ro
        -v /usr/lib/x86_64-linux-gnu/libnghttp2.so.14:/usr/lib/x86_64-linux-gnu/libnghttp2.so.14:ro
        -v /usr/lib/x86_64-linux-gnu/libidn2.so.0:/usr/lib/x86_64-linux-gnu/libidn2.so.0:ro
        -v /usr/lib/x86_64-linux-gnu/librtmp.so.1:/usr/lib/x86_64-linux-gnu/librtmp.so.1:ro
        -v /usr/lib/x86_64-linux-gnu/libssh.so.4:/usr/lib/x86_64-linux-gnu/libssh.so.4:ro
        -v /usr/lib/x86_64-linux-gnu/libpsl.so.5:/usr/lib/x86_64-linux-gnu/libpsl.so.5:ro
        -v /usr/lib/x86_64-linux-gnu/libldap.so.2:/usr/lib/x86_64-linux-gnu/libldap.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/liblber.so.2:/usr/lib/x86_64-linux-gnu/liblber.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/libbrotlidec.so.1:/usr/lib/x86_64-linux-gnu/libbrotlidec.so.1:ro
        -v /usr/lib/x86_64-linux-gnu/libbrotlicommon.so.1:/usr/lib/x86_64-linux-gnu/libbrotlicommon.so.1:ro
        -v /usr/lib/x86_64-linux-gnu/libsasl2.so.2:/usr/lib/x86_64-linux-gnu/libsasl2.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/libunistring.so.2:/usr/lib/x86_64-linux-gnu/libunistring.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/libunistring.so.5:/usr/lib/x86_64-linux-gnu/libunistring.so.5:ro
        -v /usr/lib/x86_64-linux-gnu/libgnutls.so.30:/usr/lib/x86_64-linux-gnu/libgnutls.so.30:ro
        -v /usr/lib/x86_64-linux-gnu/libp11-kit.so.0:/usr/lib/x86_64-linux-gnu/libp11-kit.so.0:ro
        -v /usr/lib/x86_64-linux-gnu/libtasn1.so.6:/usr/lib/x86_64-linux-gnu/libtasn1.so.6:ro
        -v /usr/lib/x86_64-linux-gnu/libkrb5.so.3:/usr/lib/x86_64-linux-gnu/libkrb5.so.3:ro
        -v /usr/lib/x86_64-linux-gnu/libgssapi_krb5.so.2:/usr/lib/x86_64-linux-gnu/libgssapi_krb5.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/libk5crypto.so.3:/usr/lib/x86_64-linux-gnu/libk5crypto.so.3:ro
        -v /usr/lib/x86_64-linux-gnu/libcom_err.so.2:/usr/lib/x86_64-linux-gnu/libcom_err.so.2:ro
        -v /usr/lib/x86_64-linux-gnu/libkrb5support.so.0:/usr/lib/x86_64-linux-gnu/libkrb5support.so.0:ro
        -v /usr/lib/x86_64-linux-gnu/libkeyutils.so.1:/usr/lib/x86_64-linux-gnu/libkeyutils.so.1:ro
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout commondevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _commondevops

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" != "pirlruc/commondevops" && -z "${SCRIPTS_REF}" ]]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Require vendored supply-chain thresholds
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          THR="${PWD}/_commondevops/scripts/supply-chain.profile.thresholds.yml"
          if [[ ! -f "${THR}" ]]; then
            echo "::error::Missing vendored thresholds at ${THR}; failing closed (SC-LIC-001)."
            exit 1
          fi
          echo "THRESHOLDS_PATH=${THR}" >> "${GITHUB_ENV}"
          echo "COMMONDEVOPS_SCRIPTS=${PWD}/_commondevops/scripts" >> "${GITHUB_ENV}"
          SEV="$(bash _commondevops/scripts/read-thresholds.sh vuln_fail_on_severity "${THR}")"
          SEV_UP="$(printf '%s' "${SEV}" | tr '[:lower:]' '[:upper:]')"
          SEV_LO="$(printf '%s' "${SEV}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "SEV_UP=${SEV_UP}"
            echo "SEV_LO=${SEV_LO}"
          } >> "${GITHUB_ENV}"

      - name: Install tooling
        working-directory: ${{ github.workspace }}
        env:
          INSTALL_ONLY: ${{ inputs.license_engine == 'grant' && 'syft,grype,trivy,grant' || 'syft,grype,trivy' }}
        run: bash _commondevops/scripts/install-common-tools.sh

      - name: Syft SBOM (CycloneDX + SPDX)
        id: syft
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p scan-results
          # scripts/requirements.txt is the CI tool lock (semgrep 1.178.0,
          # mcp 1.29.0). The published image still overrides PyJWT to 2.14.0.
          syft dir:. --exclude './_commondevops/**' \
            --exclude './scripts/requirements.txt' \
            --exclude './scripts/ci-requirements.in' \
            --exclude './scripts/markdownlint/**' \
            -o cyclonedx-json=scan-results/sbom-cdx.json \
            -o spdx-json=scan-results/sbom-spdx.json

      - name: Grype (SBOM)
        id: grype
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -z "${SEV_LO}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          CFG=()
          [[ -f .grype.yaml ]] && CFG=(--config .grype.yaml)
          if [[ -f scan-results/sbom-cdx.json ]]; then
            grype "sbom:scan-results/sbom-cdx.json" "${CFG[@]}" --fail-on "${SEV_LO}" \
              -o json=scan-results/grype.json
          else
            grype dir:. --exclude './_commondevops/**' \
              --exclude './scripts/requirements.txt' \
              --exclude './scripts/ci-requirements.in' \
              --exclude './scripts/markdownlint/**' \
              "${CFG[@]}" --fail-on "${SEV_LO}" -o json=scan-results/grype.json
          fi

      - name: Trivy filesystem
        id: trivy
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -z "${SEV_UP}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          mkdir -p scan-results
          CFG=()
          [[ -f trivy.yaml ]] && CFG=(--config trivy.yaml)
          trivy fs --scanners vuln --severity "CRITICAL,${SEV_UP}" \
            --skip-dirs _commondevops,scripts/markdownlint \
            --skip-files scripts/requirements.txt,scripts/ci-requirements.in \
            --format sarif --output scan-results/trivy.sarif \
            "${CFG[@]}" .
          trivy fs --scanners vuln --severity "CRITICAL,${SEV_UP}" \
            --skip-dirs _commondevops,scripts/markdownlint \
            --skip-files scripts/requirements.txt,scripts/ci-requirements.in \
            --exit-code 1 "${CFG[@]}" .

      - name: License gate (grant)
        id: grant
        if: inputs.license_engine == 'grant'
        continue-on-error: true
        env:
          THRESHOLDS_PATH: ${{ env.THRESHOLDS_PATH }}
          GRANT_CONFIG_PATH: .grant.yaml
        run: |
          set -euo pipefail
          python3 "${COMMONDEVOPS_SCRIPTS}/generate_grant_config.py"
          DRY=()
          if [[ "${ADVISORY}" == "true" ]]; then
            DRY=(--dry-run)
          fi
          grant check scan-results/sbom-spdx.json --disable-file-search -c .grant.yaml "${DRY[@]}"

      - name: License gate (spdx-deny)
        id: spdx_deny
        if: inputs.license_engine == 'spdx-deny'
        continue-on-error: true
        env:
          SPDX_SBOM_PATH: scan-results/sbom-spdx.json
          LICENSE_DENY_LIST: ${{ inputs.license_deny_list }}
          THRESHOLDS_PATH: ${{ env.THRESHOLDS_PATH }}
        run: python3 "${COMMONDEVOPS_SCRIPTS}/license_gate.py"

      - name: Gate — supply-chain
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          SYFT: ${{ steps.syft.outcome }}
          GRYPE: ${{ steps.grype.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          GRANT: ${{ steps.grant.outcome }}
          SPDX: ${{ steps.spdx_deny.outcome }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${SYFT}" != "skipped" && -n "${SYFT}" ]]; then args+=(syft="${SYFT}"); fi
          if [[ "${GRYPE}" != "skipped" && -n "${GRYPE}" ]]; then args+=(grype="${GRYPE}"); fi
          if [[ "${TRIVY}" != "skipped" && -n "${TRIVY}" ]]; then args+=(trivy="${TRIVY}"); fi
          if [[ "${GRANT}" != "skipped" && -n "${GRANT}" ]]; then args+=(grant="${GRANT}"); fi
          if [[ "${SPDX}" != "skipped" && -n "${SPDX}" ]]; then args+=(spdx_deny="${SPDX}"); fi
          bash _commondevops/scripts/gate-aggregate.sh "${args[@]}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: common-supply-chain-results
          path: ${{ inputs.working_directory }}/scan-results/
          if-no-files-found: ignore
          retention-days: ${{ inputs.results_retention_days }}

  upload-sarif:
    needs: supply-chain
    if: always() && needs.supply-chain.result != 'skipped' && needs.supply-chain.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      security-events: write
    steps:
      - name: Download scan results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: common-supply-chain-results
          path: scan-results
      - name: Upload Trivy SARIF
        if: hashFiles('scan-results/trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scan-results/trivy.sarif
          category: trivy-fs
