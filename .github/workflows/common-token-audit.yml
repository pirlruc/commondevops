name: Common Token Audit (reusable)

# CI-038: long-lived PATs must expire within ci_token_max_lifetime_days (90).
# Callers pass only the PATs they actually use. GITHUB_TOKEN is not audited.

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: >
          Commit of this repo to check out. Required for a cross-repo caller
          and must match the uses: pin (CI-034). github.workflow_sha is the
          caller, not this repository.
        required: false
        type: string
        default: ""
    secrets:
      scorecard_token:
        required: false
      guardrails_token:
        required: false
      containerdevops_token:
        description: CONTAINERDEVOPS_READ_TOKEN when the caller has that secret
        required: false
      checkout_token:
        description: Token that can read pirlruc/commondevops when the caller is another repo
        required: false
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('dispatch-token-audit-{0}', github.ref)
        || format('call-token-audit-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          # github.workflow_sha is the caller. Same-repo runs fall back to github.sha.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          sparse-checkout: |
            scripts/check-token-expiry.sh
          sparse-checkout-cone-mode: false
      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${REPO}" != "pirlruc/commondevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi
      - name: Check PAT expiry
        env:
          SCORECARD_TOKEN: ${{ secrets.scorecard_token }}
          GUARDRAILS_TOKEN: ${{ secrets.guardrails_token }}
          CONTAINERDEVOPS_TOKEN: ${{ secrets.containerdevops_token }}
          CHECKOUT_TOKEN: ${{ secrets.checkout_token }}
          MAX_DAYS: "90"
          WARN_DAYS: "7"
        run: sh scripts/check-token-expiry.sh
