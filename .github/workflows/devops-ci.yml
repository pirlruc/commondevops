name: DevOps CI (self)

on:
  # CI-024: push stays on main. Do not add dependabot/**.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  pins:
    # Token-free (CI-024): Dependabot PRs still get a submodule pin signal.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SC-DEP-004 submodule pin assert
        run: sh scripts/check-submodule-pins.sh

  scaffold:
    permissions:
      contents: read
    uses: ./.github/workflows/common-scaffold-verify.yml
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      scripts_ref: ${{ github.sha }}

  docs:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: ./.github/workflows/common-doc-verify.yml
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py scripts/validate-yaml.py scripts/license_gate.py scripts/generate_grant_config.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml .github/dependabot.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: ${{ github.sha }}

  infra-lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: ./.github/workflows/common-infra-lint.yml
    with:
      # Push/PR are blocking; workflow_dispatch honours the input.
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      shell_scripts: scripts/*.sh
      dockerfiles: docker/ci-lint/Dockerfile docker/ci-lint/Dockerfile.alpine docker/ci-supply-chain/Dockerfile docker/ci-supply-chain/Dockerfile.alpine
      scripts_ref: ${{ github.sha }}

  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: ./.github/workflows/common-secrets-sast.yml
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: ${{ github.sha }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/common-supply-chain.yml
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      license_deny_list: "[]"
      scripts_ref: ${{ github.sha }}

  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: ./.github/workflows/common-scorecard.yml
    with:
      # Private repos need SCORECARD_TOKEN (classic PAT, repo scope) for blocking Scorecard
      blocking: ${{ github.event.repository.private == false && (github.event_name != 'workflow_dispatch' || inputs.blocking) }}
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  lint-dependabot:
    # Token-free merge signal (CI-024). No Actions secrets and no submodules.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host linters
        env:
          INSTALL_ONLY: actionlint,shellcheck,hadolint
        run: bash scripts/install-common-tools.sh
      - name: actionlint
        run: actionlint -color=false .github/workflows/*.yml
      - name: shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - name: hadolint
        run: |
          set -euo pipefail
          thr="$(bash scripts/read-thresholds.sh hadolint_failure_threshold scripts/docker.profile.thresholds.yml)"
          hadolint --failure-threshold "${thr}" \
            docker/ci-lint/Dockerfile docker/ci-lint/Dockerfile.alpine \
            docker/ci-supply-chain/Dockerfile docker/ci-supply-chain/Dockerfile.alpine
