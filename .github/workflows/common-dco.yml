name: Common DCO (reusable)

# Require a Signed-off-by trailer on pull-request commits (Developer
# Certificate of Origin). Merge commits and bot authors are exempt.
# A push that is not a pull request skips the check and says so.

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common DCO (reusable)'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-dco-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common DCO (reusable)' }}

jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a Developer Certificate of Origin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" ]]; then
            echo "No pull request base. Skipping the DCO check."
            exit 0
          fi
          missing=0
          for sha in $(git rev-list "${BASE_SHA}..HEAD"); do
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [[ "$parents" -gt 2 ]]; then
              continue
            fi
            author=$(git log -1 --format=%an "$sha")
            case "${author}" in
              'dependabot[bot]' | 'renovate[bot]' | 'github-actions[bot]')
                continue
                ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "missing Signed-off-by on $sha"
              missing=1
            fi
          done
          exit "$missing"
