name: Common Infra Lint (reusable)

on:
  workflow_call:
    inputs:
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      working_directory:
        description: Repo subdirectory to lint
        required: false
        type: string
        default: .
      shell_scripts:
        description: Glob or space-separated scripts for shellcheck (empty → scripts/*.sh)
        required: false
        type: string
        default: ""
      dockerfiles:
        description: Glob or space-separated Dockerfiles for hadolint (empty → docker/**/Dockerfile*)
        required: false
        type: string
        default: ""
      scripts_ref:
        description: "Commit/tag/branch of commondevops to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      run_shfmt:
        description: Run shfmt --diff on shell scripts (SHELL-LANG-003 formatter; off by default)
        required: false
        type: boolean
        default: false
      concurrency_suffix:
        description: Distinguishes parallel calls of this workflow in one run
        required: false
        type: string
        default: ""
      container_image:
        description: Job image. Callers that cannot pull the private package pass a public image.
        required: false
        type: string
        default: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
      install_runner_packages:
        description: apt-install Python and curl. For a public image that is not ci-lint.
        required: false
        type: boolean
        default: false
      mount_runner_git:
        description: Mount the runner git into an image that has no git. Off when the image already has bash and git.
        required: false
        type: boolean
        default: true
    secrets:
      # Required when the caller is a different private repo: GITHUB_TOKEN cannot
      # read pirlruc/commondevops. Pass a PAT/fine-grained token with contents:read.
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      blocking:
        type: boolean
        default: false
      working_directory:
        type: string
        default: .
      shell_scripts:
        type: string
        default: ""
      dockerfiles:
        type: string
        default: ""
      scripts_ref:
        type: string
        default: ""
      concurrency_suffix:
        type: string
        default: ""
      mount_runner_git:
        type: boolean
        default: true

# CI-025: default-deny; jobs grant the minimum they need.
permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Infra Lint (reusable)'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-infra-lint-{0}-{1}', github.run_id, inputs.concurrency_suffix) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Infra Lint (reusable)' }}


env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  lint:
    # CI-024: Dependabot PRs cannot use Actions secrets for private reusable workflows.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    # Private package. Debian owns unsuffixed ci-lint 5.3.3 (semgrep has no musl wheel).
    # Callers grant packages: read (CI-028). --user root so the runner can write.
    container:
      image: ${{ inputs.container_image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ inputs.install_runner_packages == false && github.actor || '' }}
        # Registry login uses github.token. A fine-grained checkout_token
        # cannot pull GHCR packages. A public image skips registry login.
        password: ${{ inputs.install_runner_packages == false && github.token || '' }}
      # The published image has no git. Mount the runner git and the
      # libcurl-gnutls closure git-remote-https needs. Leave libc and libssl
      # on the image copies.
      options: >-
        --user root
        ${{ inputs.mount_runner_git && '-v /usr/bin/git:/usr/bin/git:ro -v /usr/lib/git-core:/usr/lib/git-core:ro -v /usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4:/usr/lib/x86_64-linux-gnu/libcurl-gnutls.so.4:ro -v /usr/lib/x86_64-linux-gnu/libnghttp2.so.14:/usr/lib/x86_64-linux-gnu/libnghttp2.so.14:ro -v /usr/lib/x86_64-linux-gnu/libidn2.so.0:/usr/lib/x86_64-linux-gnu/libidn2.so.0:ro -v /usr/lib/x86_64-linux-gnu/librtmp.so.1:/usr/lib/x86_64-linux-gnu/librtmp.so.1:ro -v /usr/lib/x86_64-linux-gnu/libssh.so.4:/usr/lib/x86_64-linux-gnu/libssh.so.4:ro -v /usr/lib/x86_64-linux-gnu/libpsl.so.5:/usr/lib/x86_64-linux-gnu/libpsl.so.5:ro -v /usr/lib/x86_64-linux-gnu/libldap.so.2:/usr/lib/x86_64-linux-gnu/libldap.so.2:ro -v /usr/lib/x86_64-linux-gnu/liblber.so.2:/usr/lib/x86_64-linux-gnu/liblber.so.2:ro -v /usr/lib/x86_64-linux-gnu/libbrotlidec.so.1:/usr/lib/x86_64-linux-gnu/libbrotlidec.so.1:ro -v /usr/lib/x86_64-linux-gnu/libbrotlicommon.so.1:/usr/lib/x86_64-linux-gnu/libbrotlicommon.so.1:ro -v /usr/lib/x86_64-linux-gnu/libsasl2.so.2:/usr/lib/x86_64-linux-gnu/libsasl2.so.2:ro -v /usr/lib/x86_64-linux-gnu/libunistring.so.2:/usr/lib/x86_64-linux-gnu/libunistring.so.2:ro -v /usr/lib/x86_64-linux-gnu/libunistring.so.5:/usr/lib/x86_64-linux-gnu/libunistring.so.5:ro -v /usr/lib/x86_64-linux-gnu/libgnutls.so.30:/usr/lib/x86_64-linux-gnu/libgnutls.so.30:ro -v /usr/lib/x86_64-linux-gnu/libp11-kit.so.0:/usr/lib/x86_64-linux-gnu/libp11-kit.so.0:ro -v /usr/lib/x86_64-linux-gnu/libtasn1.so.6:/usr/lib/x86_64-linux-gnu/libtasn1.so.6:ro -v /usr/lib/x86_64-linux-gnu/libkrb5.so.3:/usr/lib/x86_64-linux-gnu/libkrb5.so.3:ro -v /usr/lib/x86_64-linux-gnu/libgssapi_krb5.so.2:/usr/lib/x86_64-linux-gnu/libgssapi_krb5.so.2:ro -v /usr/lib/x86_64-linux-gnu/libk5crypto.so.3:/usr/lib/x86_64-linux-gnu/libk5crypto.so.3:ro -v /usr/lib/x86_64-linux-gnu/libcom_err.so.2:/usr/lib/x86_64-linux-gnu/libcom_err.so.2:ro -v /usr/lib/x86_64-linux-gnu/libkrb5support.so.0:/usr/lib/x86_64-linux-gnu/libkrb5support.so.0:ro -v /usr/lib/x86_64-linux-gnu/libkeyutils.so.1:/usr/lib/x86_64-linux-gnu/libkeyutils.so.1:ro' || '' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      # Ubuntu 24.04 pip is externally managed. --user installs need this
      # on a public image; the private image ignores it.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Install Python and curl on a public image
        if: inputs.install_runner_packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y python3 python3-pip curl ca-certificates xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout commondevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _commondevops

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" != "pirlruc/commondevops" && -z "${SCRIPTS_REF}" ]]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Install tooling
        working-directory: ${{ github.workspace }}
        env:
          INSTALL_ONLY: ${{ inputs.run_shfmt && 'actionlint,hadolint,shellcheck,shfmt' || 'actionlint,hadolint,shellcheck' }}
        run: bash _commondevops/scripts/install-common-tools.sh

      - name: Install zizmor
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --require-hashes -r _commondevops/scripts/requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Resolve lint thresholds
        id: thr
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shell_file="docs/guardrails/shell/profile.thresholds.yml"
          if [[ ! -f "${shell_file}" ]]; then
            shell_file="_commondevops/scripts/shell.profile.thresholds.yml"
          fi
          docker_file="docs/guardrails/docker/profile.thresholds.yml"
          if [[ ! -f "${docker_file}" ]]; then
            docker_file="_commondevops/scripts/docker.profile.thresholds.yml"
          fi
          shell_sev="$(bash _commondevops/scripts/read-thresholds.sh shellcheck_failure_threshold "${shell_file}")"
          hadolint_sev="$(bash _commondevops/scripts/read-thresholds.sh hadolint_failure_threshold "${docker_file}")"
          {
            echo "shellcheck=${shell_sev}"
            echo "hadolint=${hadolint_sev}"
          } >> "$GITHUB_OUTPUT"

      - name: actionlint
        id: actionlint
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mapfile -t WFS < <(find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)
          if [[ ${#WFS[@]} -eq 0 ]]; then
            echo "No workflows to lint"
            exit 0
          fi
          if (( ${#WFS[@]} > 40 )); then
            echo "CI-035: ${#WFS[@]} workflow files exceeds actionlint cap of 40" >&2
            exit 1
          fi
          actionlint "${WFS[@]}"

      - name: shellcheck
        id: shellcheck
        continue-on-error: true
        env:
          SHELL_SCRIPTS: ${{ inputs.shell_scripts }}
          SEVERITY: ${{ steps.thr.outputs.shellcheck }}
        run: |
          set -euo pipefail
          if [[ -z "${SEVERITY}" ]]; then
            echo "empty shellcheck_failure_threshold" >&2
            exit 1
          fi
          if [[ -n "${SHELL_SCRIPTS}" ]]; then
            # shellcheck disable=SC2086
            shellcheck --severity="${SEVERITY}" ${SHELL_SCRIPTS}
          else
            mapfile -t SHS < <(find scripts -name '*.sh' 2>/dev/null || true)
            if [[ ${#SHS[@]} -eq 0 ]]; then
              echo "No shell scripts"
              exit 0
            fi
            shellcheck --severity="${SEVERITY}" "${SHS[@]}"
          fi

      - name: hadolint
        id: hadolint
        continue-on-error: true
        env:
          DOCKERFILES: ${{ inputs.dockerfiles }}
          THRESHOLD: ${{ steps.thr.outputs.hadolint }}
        run: |
          set -euo pipefail
          if [[ -z "${THRESHOLD}" ]]; then
            echo "empty hadolint_failure_threshold" >&2
            exit 1
          fi
          if [[ -n "${DOCKERFILES}" ]]; then
            # shellcheck disable=SC2086
            hadolint --failure-threshold "${THRESHOLD}" ${DOCKERFILES}
          else
            mapfile -t DFS < <(find docker -name 'Dockerfile*' 2>/dev/null || true)
            if [[ ${#DFS[@]} -eq 0 ]]; then
              echo "No Dockerfiles"
              exit 0
            fi
            hadolint --failure-threshold "${THRESHOLD}" "${DFS[@]}"
          fi

      - name: shfmt
        id: shfmt
        if: inputs.run_shfmt
        continue-on-error: true
        env:
          SHELL_SCRIPTS: ${{ inputs.shell_scripts }}
        run: |
          set -euo pipefail
          if [[ -n "${SHELL_SCRIPTS}" ]]; then
            # shellcheck disable=SC2086
            shfmt --diff ${SHELL_SCRIPTS}
          else
            mapfile -t SHS < <(find scripts -name '*.sh' 2>/dev/null || true)
            if [[ ${#SHS[@]} -eq 0 ]]; then
              echo "No shell scripts"
              exit 0
            fi
            shfmt --diff "${SHS[@]}"
          fi

      - name: zizmor
        id: zizmor
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ -d .github/workflows ]]; then
            # Informational findings (e.g. superfluous-actions) must not fail blocking CI.
            CFG=()
            [[ -f .github/config/zizmor.yml ]] && CFG=(-c .github/config/zizmor.yml)
            zizmor --min-severity=low "${CFG[@]}" .github/workflows
          else
            echo "No workflows for zizmor"
          fi

      - name: Gate — lint
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          ADVISORY: ${{ env.ADVISORY }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          HADOLINT: ${{ steps.hadolint.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
          SHFMT: ${{ steps.shfmt.outcome }}
        run: |
          set -euo pipefail
          bash _commondevops/scripts/gate-aggregate.sh \
            actionlint="${ACTIONLINT}" \
            shellcheck="${SHELLCHECK}" \
            hadolint="${HADOLINT}" \
            zizmor="${ZIZMOR}" \
            shfmt="${SHFMT}"
