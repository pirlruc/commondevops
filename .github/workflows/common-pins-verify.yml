name: Common Pins Verify (reusable)

# SC-DEP-004: run the caller's scripts/check-submodule-pins.sh.
# Expected gitlinks differ per repository, so the script stays in the caller.
# Token-free. Cross-repo callers still pass scripts_ref equal to the uses pin.

on:
  workflow_call:
    inputs:
      pin_script:
        description: Caller script that asserts submodule gitlinks
        required: false
        type: string
        default: scripts/check-submodule-pins.sh
      scripts_ref:
        description: Must equal the caller's uses pin (CI-034). Not checked out.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pin_script:
        type: string
        default: scripts/check-submodule-pins.sh
      scripts_ref:
        type: string
        default: ""

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Pins Verify (reusable)'
        && format('dispatch-{0}-{1}', github.workflow, github.ref)
        || format('call-pins-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.workflow == 'Common Pins Verify (reusable)' }}

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ "${REPO}" != "pirlruc/commondevops" ] && [ -z "${SCRIPTS_REF}" ]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Submodule pin assert
        env:
          PIN_SCRIPT: ${{ inputs.pin_script }}
        run: |
          set -eu
          if [ ! -f "${PIN_SCRIPT}" ]; then
            echo "error: ${PIN_SCRIPT} not found" >&2
            exit 1
          fi
          sh "${PIN_SCRIPT}"
