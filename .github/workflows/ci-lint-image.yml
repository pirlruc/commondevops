---
# Thin caller — publishes ghcr.io/pirlruc/ci-lint (+ Docker Hub when secrets set).
# Debian and Alpine variants; Alpine owns unsuffixed tags (lower vuln posture as of 2026-08).
# containerdevops pin: tag 5.0.1 (GHCR digest handoff, fail-closed empty image_ref).
name: CI Lint Image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 15 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-lint/**"
      - ".github/workflows/ci-lint-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR/Hub (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      dockerfile: docker/ci-lint/Dockerfile
      working_directory: .
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      runner_image: ""
      run_infra_lint: false
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ github.token }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  lint-alpine:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      dockerfile: docker/ci-lint/Dockerfile.alpine
      working_directory: .
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ github.token }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: [lint, lint-alpine]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile
      image_name: ci-lint:ci-debian
      artifact_name: container-image-debian
      handoff_package: ci-lint
      structure_test_config: docker/ci-lint/container-structure-test.yml
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Debian 13
        variant. Non-root 1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build-alpine:
    needs: [lint, lint-alpine]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile.alpine
      image_name: ci-lint:ci-alpine
      artifact_name: container-image-alpine
      handoff_package: ci-lint
      structure_test_config: docker/ci-lint/container-structure-test.yml
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      size_class: ci_toolchain
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Alpine 3.24
        variant. Non-root 1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-results-debian
      sarif_category: trivy-image-debian
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-alpine:
    needs: build-alpine
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      results_artifact: container-scan-results-alpine
      sarif_category: trivy-image-alpine
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # Advisory posture scan (os+library, ignorefile=none) — does not block publish.
  scan-posture:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-posture-debian
      sarif_category: trivy-posture-debian
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan-posture-alpine:
    needs: build-alpine
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      results_artifact: container-scan-posture-alpine
      sarif_category: trivy-posture-alpine
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile
      image_name: ci-lint
      dockerhub_image: pirlruc/ci-lint
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      platforms: linux/amd64
      tag_suffix: -debian
      tag_alias_unsuffixed: false
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Debian 13
        variant. Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-lint
      image_url: https://hub.docker.com/r/pirlruc/ci-lint
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-lint.md
      dockerhub_short_description: >-
        CI toolchain: actionlint, hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish-alpine:
    needs: [build-alpine, scan-alpine]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile.alpine
      image_name: ci-lint
      dockerhub_image: pirlruc/ci-lint
      scripts_ref: 2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
      platforms: linux/amd64
      tag_suffix: -alpine
      tag_alias_unsuffixed: true
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Alpine 3.24
        variant (default unsuffixed tags). Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-lint
      image_url: https://hub.docker.com/r/pirlruc/ci-lint
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-lint.md
      dockerhub_short_description: >-
        CI toolchain: actionlint, hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # PR-only: ci-run-* is not also a release tag. After publish retag, never delete.
  cleanup:
    needs: [build, scan]
    if: always() && github.event_name == 'pull_request' && needs.build.outputs.handoff_tag != ''
    permissions:
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-handoff-cleanup.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      package: ${{ needs.build.outputs.handoff_package }}
      tag: ${{ needs.build.outputs.handoff_tag }}

  cleanup-alpine:
    needs: [build-alpine, scan-alpine]
    if: always() && github.event_name == 'pull_request' && needs.build-alpine.outputs.handoff_tag != ''
    permissions:
      packages: write
    uses: pirlruc/containerdevops/.github/workflows/container-handoff-cleanup.yml@2f33d910dbaf5bc0a9b5d6cabc56037a43077ebd
    with:
      package: ${{ needs.build-alpine.outputs.handoff_package }}
      tag: ${{ needs.build-alpine.outputs.handoff_tag }}
