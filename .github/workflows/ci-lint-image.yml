---
# Thin caller — publishes ghcr.io/pirlruc/ci-lint (+ Docker Hub when secrets set).
# containerdevops pin: tag 2.2.0 (ignorefile=none + install hardening).
name: CI Lint Image

on:
  release:
    types: [published]
  schedule:
    - cron: "17 5 15 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-lint/**"
      - ".github/workflows/ci-lint-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR/Hub (break-glass; also runs on release / schedule)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-lint.yml@0fb7bab3411a6756911debce0624061d60537a33
    with:
      dockerfile: docker/ci-lint/Dockerfile
      working_directory: .
      scripts_ref: 0fb7bab3411a6756911debce0624061d60537a33
      runner_image: ""
      run_infra_lint: false
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ github.token }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  build:
    needs: lint
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: read
    uses: pirlruc/containerdevops/.github/workflows/container-build.yml@0fb7bab3411a6756911debce0624061d60537a33
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile
      image_name: ci-lint:ci
      structure_test_config: docker/ci-lint/container-structure-test.yml
      scripts_ref: 0fb7bab3411a6756911debce0624061d60537a33
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      # Rootfs ~545 MB measured via du -sxm /; headroom for base churn.
      image_max_size_mb: "700"
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Non-root
        1000:1000, linux/amd64.
      dhi_login: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@0fb7bab3411a6756911debce0624061d60537a33
    with:
      image: ci-lint:ci
      image_artifact: container-image
      scripts_ref: 0fb7bab3411a6756911debce0624061d60537a33
      pkg_types: library
      ignorefile: docker/ci-lint/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  # Advisory posture scan (os+library, ignorefile=none) — does not block publish.
  scan-posture:
    needs: build
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-scan.yml@0fb7bab3411a6756911debce0624061d60537a33
    with:
      image: ci-lint:ci
      image_artifact: container-image
      scripts_ref: 0fb7bab3411a6756911debce0624061d60537a33
      pkg_types: os,library
      ignorefile: none
      blocking: false
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  publish:
    needs: [build, scan]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@0fb7bab3411a6756911debce0624061d60537a33
    with:
      context: docker/ci-lint
      dockerfile: docker/ci-lint/Dockerfile
      image_name: ci-lint
      dockerhub_image: pirlruc/ci-lint
      scripts_ref: 0fb7bab3411a6756911debce0624061d60537a33
      platforms: linux/amd64
      image_title: ci-lint
      image_description: >-
        Short-lived CI toolchain image for lint and secrets/SAST: actionlint,
        hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep. Non-root
        1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-lint
      image_url: https://hub.docker.com/r/pirlruc/ci-lint
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub-ci-lint.md
      dockerhub_short_description: >-
        CI toolchain: actionlint, hadolint, shellcheck, zizmor, yamllint, gitleaks, semgrep
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: true
      tag_latest: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
      verify_command: /bin/true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
