schemaVersion: "2.0.0"
metadataTest:
  envVars:
    - key: PYTHONDONTWRITEBYTECODE
      value: "1"
    - key: PYTHONUNBUFFERED
      value: "1"
commandTests:
  - name: syft
    command: "syft"
    args: ["version"]
    exitCode: 0
  - name: grype
    command: "grype"
    args: ["version"]
    exitCode: 0
  - name: trivy
    command: "trivy"
    args: ["--version"]
    exitCode: 0
  - name: shellcheck
    command: "shellcheck"
    args: ["--version"]
    exitCode: 0
  - name: hadolint
    command: "hadolint"
    args: ["--version"]
    exitCode: 0
  - name: actionlint
    command: "actionlint"
    args: ["-version"]
    exitCode: 0
  - name: zizmor
    command: "zizmor"
    args: ["--version"]
    exitCode: 0
  - name: semgrep
    command: "semgrep"
    args: ["--version"]
    exitCode: 0
  - name: grant
    command: "grant"
    args: ["version"]
    exitCode: 0
fileExistenceTests:
  - name: syft binary
    path: "/usr/local/bin/syft"
    shouldExist: true
  - name: grype binary
    path: "/usr/local/bin/grype"
    shouldExist: true
  - name: trivy binary
    path: "/usr/local/bin/trivy"
    shouldExist: true
  - name: uv binary
    path: "/usr/local/bin/uv"
    shouldExist: true
  - name: grant binary
    path: "/usr/local/bin/grant"
    shouldExist: true
