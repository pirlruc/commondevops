schemaVersion: "2.0.0"
metadataTest:
  cmd: ["sh"]
  envVars:
    - key: PYTHONDONTWRITEBYTECODE
      value: "1"
    - key: PYTHONUNBUFFERED
      value: "1"
commandTests:
  - name: shellcheck
    command: "shellcheck"
    args: ["--version"]
    exitCode: 0
  - name: hadolint
    command: "hadolint"
    args: ["--version"]
    exitCode: 0
  - name: actionlint
    command: "actionlint"
    args: ["-version"]
    exitCode: 0
  - name: gitleaks
    command: "gitleaks"
    args: ["version"]
    exitCode: 0
  - name: zizmor
    command: "zizmor"
    args: ["--version"]
    exitCode: 0
  - name: yamllint
    command: "yamllint"
    args: ["--version"]
    exitCode: 0
  - name: "no setuid or setgid files"
    command: "sh"
    args:
      - "-c"
      - "! find / -xdev -type f -perm -4000 -print | grep -q . && ! find / -xdev -type f -perm -2000 -print | grep -q ."
fileExistenceTests:
  - name: shell present
    path: "/bin/sh"
    shouldExist: true
  - name: shellcheck binary
    path: "/usr/local/bin/shellcheck"
    shouldExist: true
  - name: hadolint binary
    path: "/usr/local/bin/hadolint"
    shouldExist: true
  - name: actionlint binary
    path: "/usr/local/bin/actionlint"
    shouldExist: true
  - name: gitleaks binary
    path: "/usr/local/bin/gitleaks"
    shouldExist: true
  - name: uv absent
    path: "/usr/local/bin/uv"
    shouldExist: false
  - name: cosign absent
    path: "/usr/local/bin/cosign"
    shouldExist: false
  - name: trivy absent
    path: "/usr/local/bin/trivy"
    shouldExist: false
