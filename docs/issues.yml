# Authored backlog for commondevops.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.1.0/github-issue-adr

milestones:
  - name: Phase 1 — Foundation
    epics:
      - id: CMN-001
        status: done
        title: Reusable common-* workflows (infra lint, secrets/SAST, supply-chain, scorecard, release)
        overview:
          problem: Language devops repos duplicate gitleaks/semgrep/SBOM/Scorecard/release wiring.
          goal: Ship pinned reusable workflows with CI-024/CI-025 contracts and scripts_ref checkout.
        architecture:
          target: .github/workflows/common-*.yml
          modules:
            - .github/workflows/common-infra-lint.yml
            - .github/workflows/common-secrets-sast.yml
            - .github/workflows/common-supply-chain.yml
            - .github/workflows/common-scorecard.yml
            - .github/workflows/common-release.yml
            - scripts/license_gate.py
            - scripts/install-common-tools.sh
        acceptance_criteria:
          - Callers pin SHA and pass scripts_ref + checkout_token for private cross-repo use
          - blocking=false is advisory (continue-on-error); Dependabot actor skips secret jobs
          - Top-level permissions default-deny; checkout persist-credentials false
        guardrail_refs:
          - CI-024
          - CI-025
          - SC-SBOM-001
          - SC-LIC-001
        tasks:
          - id: CMN-001-T1
            status: done
            title: Land common-* reusable workflows and install/license scripts
            instructions:
              files:
                - .github/workflows/
                - scripts/
            verification:
              - actionlint .github/workflows/common-infra-lint.yml
              - python3 scripts/license_gate.py
            guardrail_refs:
              - CI-025

      - id: CMN-002
        status: done
        title: ci-base image (DHI-first tool assembly) and publish caller
        overview:
          problem: Host runners reinstall syft/grype/trivy/hadolint per job; no shared CI image.
          goal: Digest-pinned docker/ci-base published to ghcr.io/pirlruc/ci-base via containerdevops.
        architecture:
          target: docker/ci-base + ci-base-image.yml
          modules:
            - docker/ci-base/Dockerfile
            - docker/ci-base/container-structure-test.yml
            - .github/workflows/ci-base-image.yml
            - scripts/pin-dhi-digests.sh
        acceptance_criteria:
          - DHI COPY --from for syft/grype/trivy/shellcheck; Hub for hadolint/actionlint; uv for Python CLIs
          - structure-test covers binaries; dhi_login true on build/publish
        guardrail_refs:
          - DOCKER-BUILD-003
          - DOCKER-LINT-001
          - DOCKER-TEST-001
        tasks:
          - id: CMN-002-T1
            status: done
            title: Author Dockerfile structure-test and containerdevops thin caller
            instructions:
              files:
                - docker/ci-base/
                - .github/workflows/ci-base-image.yml
            verification:
              - hadolint docker/ci-base/Dockerfile
            guardrail_refs:
              - DOCKER-BUILD-003

      - id: CMN-003
        status: done
        title: Dependabot multi-ecosystem groups (SC-DEP)
        overview:
          problem: Actions and docker/ci-base base images need monthly grouped updates.
          goal: Seed .github/dependabot.yml with multi-ecosystem-groups all-dependencies.
        architecture:
          target: .github/dependabot.yml
          modules:
            - .github/dependabot.yml
        acceptance_criteria:
          - Ecosystems github-actions and docker (/docker/ci-base)
          - Commented dhi registry block retained for Dependabot secrets
        guardrail_refs:
          - SC-DEP-001
          - SC-DEP-002
          - SC-DEP-003
        tasks:
          - id: CMN-003-T1
            status: done
            title: Author dependabot.yml for actions and ci-base docker
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - test -f .github/dependabot.yml
            guardrail_refs:
              - SC-DEP-003

      - id: CMN-004
        status: done
        title: ai-reviewer continuous-improvement prompt (CMN-* prefixes)
        overview:
          problem: No Automation prompt for ongoing commondevops review.
          goal: docs/continuous-improvement.md with seven-section skeleton and CMN-* id prefixes.
        architecture:
          target: docs/continuous-improvement.md
          modules:
            - docs/continuous-improvement.md
        acceptance_criteria:
          - Prompt invents no baked file trees; output is docs/issues.yml PR only
          - Id prefixes documented (CMN-WF, CMN-IMG, CMN-DOC, …)
        guardrail_refs:
          - CI-008
        tasks:
          - id: CMN-004-T1
            status: done
            title: Author continuous-improvement.md for GitHub Agents Automations
            instructions:
              files:
                - docs/continuous-improvement.md
            verification:
              - test -f docs/continuous-improvement.md
            guardrail_refs:
              - CI-008

  - name: Continuous improvement
    epics:
      - id: CMN-005
        status: done
        title: Self-CI and scheduled security trigger policy
        overview:
          problem: devops-ci was dispatch-only; no weekly security lane for rule/advisory drift.
          goal: Push/PR main + concurrency for devops-ci; weekly devops-security for secrets/SAST, supply-chain, Scorecard.
        architecture:
          target: .github/workflows/devops-ci.yml + devops-security.yml
          modules:
            - .github/workflows/devops-ci.yml
            - .github/workflows/devops-security.yml
        acceptance_criteria:
          - Push/PR set blocking true; workflow_dispatch uses inputs.blocking
          - Weekly cron Mon 06:17 UTC; concurrency groups present
        guardrail_refs:
          - CI-002
          - CI-024
          - CI-025
        tasks:
          - id: CMN-005-T1
            status: done
            title: Wire devops-ci push/PR triggers and add devops-security.yml
            instructions:
              files:
                - .github/workflows/devops-ci.yml
                - .github/workflows/devops-security.yml
            verification:
              - actionlint .github/workflows/devops-ci.yml
              - actionlint .github/workflows/devops-security.yml
            guardrail_refs:
              - CI-002

      - id: CMN-006
        status: done
        title: Release-gated ci-base publish and monthly rebuild
        overview:
          problem: Push-to-main published images; bare semver tags rejected; no CI-027 cadence.
          goal: Publish on release/schedule/dispatch+publish; relax tag regex; monthly rebuild cron.
        architecture:
          target: ci-base-image.yml + common-release.yml
          modules:
            - .github/workflows/ci-base-image.yml
            - .github/workflows/common-release.yml
        acceptance_criteria:
          - No push-to-main publish; release published + monthly 15th cron + break-glass dispatch
          - Tag regex accepts 1.2.3 and v1.2.3
        guardrail_refs:
          - CI-027
          - DOCKER-DELIV-001
        tasks:
          - id: CMN-006-T1
            status: done
            title: Rewrite ci-base-image triggers and relax common-release tag regex
            instructions:
              files:
                - .github/workflows/ci-base-image.yml
                - .github/workflows/common-release.yml
            verification:
              - actionlint .github/workflows/ci-base-image.yml
            guardrail_refs:
              - CI-027

      - id: CMN-007
        status: done
        title: CI-026 digest-pin Hub/GHCR donors in ci-base
        overview:
          problem: hadolint, actionlint, and uv COPY --from lines were tag-only.
          goal: Digest-pin all donors including grant; structure-test covers grant.
        architecture:
          target: docker/ci-base
          modules:
            - docker/ci-base/Dockerfile
            - docker/ci-base/container-structure-test.yml
        acceptance_criteria:
          - Every FROM and COPY --from carries @sha256
          - grant binary present and version-tested
        guardrail_refs:
          - CI-026
          - DOCKER-BUILD-003
        tasks:
          - id: CMN-007-T1
            status: done
            title: Digest-pin donors and add grant to Dockerfile and structure-test
            instructions:
              files:
                - docker/ci-base/Dockerfile
                - docker/ci-base/container-structure-test.yml
            verification:
              - hadolint docker/ci-base/Dockerfile
            guardrail_refs:
              - CI-026

      - id: CMN-008
        status: done
        title: Vendored supply-chain thresholds and fail-closed resolution
        overview:
          problem: THRESHOLDS_PATH pointed at unpopulated docs/guardrails/; missing file returned [].
          goal: Vendor scripts/supply-chain.profile.thresholds.yml; fail closed when file missing.
        architecture:
          target: scripts/ + common-supply-chain.yml
          modules:
            - scripts/supply-chain.profile.thresholds.yml
            - scripts/license_gate.py
            - scripts/read-thresholds.sh
            - .github/workflows/common-supply-chain.yml
        acceptance_criteria:
          - THRESHOLDS_PATH uses _commondevops sparse-checkout scripts path
          - Missing thresholds exits non-zero; effective deny list is logged
        guardrail_refs:
          - SC-LIC-001
        tasks:
          - id: CMN-008-T1
            status: done
            title: Vendor thresholds and make license_gate.py fail closed
            instructions:
              files:
                - scripts/supply-chain.profile.thresholds.yml
                - scripts/license_gate.py
                - .github/workflows/common-supply-chain.yml
            verification:
              - THRESHOLDS_PATH=/nonexistent python3 scripts/license_gate.py; test $? -ne 0
            guardrail_refs:
              - SC-LIC-001

      - id: CMN-009
        status: done
        title: Grant license gate on Syft SPDX SBOM
        overview:
          problem: Substring deny list cannot express SPDX operators; empty deny list denied nothing.
          goal: Default license_engine=grant with generated .grant.yaml; keep spdx-deny fallback.
        architecture:
          target: grant evaluator path
          modules:
            - scripts/generate_grant_config.py
            - scripts/install-common-tools.sh
            - .github/workflows/common-supply-chain.yml
            - docker/ci-base/Dockerfile
        acceptance_criteria:
          - grant check uses --disable-file-search against sbom-spdx.json
          - license_engine input selects grant or spdx-deny
          - GRANT_VERSION 0.6.8 installable via install-common-tools.sh
        guardrail_refs:
          - SC-LIC-001
          - SC-LIC-002
        tasks:
          - id: CMN-009-T1
            status: done
            title: Add generate_grant_config.py and wire license_engine in supply-chain
            instructions:
              files:
                - scripts/generate_grant_config.py
                - scripts/install-common-tools.sh
                - .github/workflows/common-supply-chain.yml
            verification:
              - python3 scripts/generate_grant_config.py
              - test -f .grant.yaml
            guardrail_refs:
              - SC-LIC-002

      - id: CMN-010
        status: done
        title: DOCKER-PERF-001 size deviation for ci-base toolchain image
        overview:
          problem: Org image_max_size_mb=300 fits product images; ci-base bundles scanners and exceeds ~1.2GB uncompressed on GHA.
          goal: Document approved repo_value=1500 and pass image_max_size_mb override into container-build.
        architecture:
          target: ci-base size gate
          modules:
            - docs/guardrail-deviations.yml
            - .github/workflows/ci-base-image.yml
        acceptance_criteria:
          - Deviation recorded for DOCKER-PERF-001 image_max_size_mb with epic CMN-010
          - ci-base-image.yml passes image_max_size_mb matching repo_value
          - CI Base Image build size gate passes on PRs
        guardrail_refs:
          - DOCKER-PERF-001
        tasks:
          - id: CMN-010-T1
            status: done
            title: Wire size override and record deviation
            instructions:
              files:
                - docs/guardrail-deviations.yml
                - .github/workflows/ci-base-image.yml
                - docs/issues.yml
            verification:
              - grep -q 'image_max_size_mb: \"700\"' .github/workflows/ci-lint-image.yml
              - grep -q 'DOCKER-PERF-001' docs/guardrail-deviations.yml
            guardrail_refs:
              - DOCKER-PERF-001

      - id: CMN-011
        status: done
        title: Time-boxed Trivy ignores for vendor-static ci-base donor binaries
        overview:
          problem: >
            HIGH/CRITICAL CVEs embedded in upstream static donor binaries (syft/grype/trivy/grant/actionlint)
            fail DOCKER-SEC-001 image scan even after PyJWT/mcp upgrades and actionlint 1.7.12.
          goal: >
            Path-scoped .trivyignore.yaml (review 2026-11-11) plus containerdevops ignorefile support;
            refresh donor digests when upstream ships fixes.
        architecture:
          target: ci-base scan ignore path
          modules:
            - .trivyignore.yaml
            - docker/ci-base/Dockerfile
            - .github/workflows/ci-base-image.yml
        acceptance_criteria:
          - .trivyignore.yaml covers remaining donor-binary HIGH/CRITICAL with path + statement
          - PyJWT 2.13 via semgrep 1.172.0; mcp==1.29.0 via uv override (not ignored; mcp 2.x breaks semgrep FastMCP)

          - Local and CI Trivy --severity HIGH,CRITICAL --exit-code 1 passes with ignorefile
          - containerdevops pin includes ignorefile-aware container-scan.yml
        guardrail_refs:
          - DOCKER-SEC-001
        tasks:
          - id: CMN-011-T1
            status: done
            title: Author ignorefile, bump actionlint/PyJWT/mcp, pin containerdevops
            instructions:
              files:
                - .trivyignore.yaml
                - docker/ci-base/Dockerfile
                - .github/workflows/ci-base-image.yml
                - docs/issues.yml
            verification:
              - docker build -t ci-base:ci -f docker/ci-base/Dockerfile docker/ci-base
              - >
                docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
                -v $PWD/.trivyignore.yaml:/tmp/.trivyignore.yaml:ro
                aquasec/trivy:0.73.0 image --severity HIGH,CRITICAL --exit-code 1
                --pkg-types library --scanners vuln --ignorefile /tmp/.trivyignore.yaml ci-base:ci
            guardrail_refs:
              - DOCKER-SEC-001

      - id: CMN-012
        status: done
        title: Consumer-facing package metadata and registry pages
        overview:
          problem: >-
            Published ci-lint / ci-supply-chain images inherited the repository
            description via docker/metadata-action defaults. Hub Overview was empty;
            Dependabot still pointed at deprecated docker/ci-base.
          goal: >-
            Pin containerdevops with image_* / dockerhub_* inputs; split Hub and
            GitHub Packages consumer docs; retarget Dependabot and clear ci-base refs.
        architecture:
          target: ci-*-image.yml + registry docs
          modules:
            - .github/workflows/ci-lint-image.yml
            - .github/workflows/ci-supply-chain-image.yml
            - docker/ci-lint/Dockerfile
            - docker/ci-supply-chain/Dockerfile
            - docs/docker-hub-ci-lint.md
            - docs/docker-hub-ci-supply-chain.md
            - docs/github-packages-ci-lint.md
            - docs/github-packages-ci-supply-chain.md
            - .github/dependabot.yml
        acceptance_criteria:
          - Publish labels carry image-specific title/description
          - Hub Overview synced from docs/docker-hub-ci-*.md
          - Dependabot docker ecosystems cover ci-lint and ci-supply-chain
          - No active scripts/workflows still default to ci-base
        guardrail_refs:
          - DOCKER-DOC-001
          - DOCKER-DOC-002
          - SC-DEP-001
        tasks:
          - id: CMN-012-T1
            status: done
            title: Wire metadata overrides, Hub sync, and re-pin containerdevops
            instructions:
              files:
                - .github/workflows/ci-lint-image.yml
                - .github/workflows/ci-supply-chain-image.yml
                - docker/ci-lint/Dockerfile
                - docker/ci-supply-chain/Dockerfile
            verification:
              - rg -n "image_description|dockerhub_readme" .github/workflows/ci-lint-image.yml
            guardrail_refs:
              - DOCKER-DOC-001
          - id: CMN-012-T2
            status: done
            title: Split Hub and GitHub Packages docs; retarget Dependabot
            instructions:
              files:
                - docs/docker-hub-ci-lint.md
                - docs/github-packages-ci-lint.md
                - docs/docker-hub-ci-supply-chain.md
                - docs/github-packages-ci-supply-chain.md
                - .github/dependabot.yml
                - scripts/check-ci-local.sh
            verification:
              - test -f docs/github-packages-ci-lint.md
              - rg -n "ci-lint|ci-supply-chain" .github/dependabot.yml
            guardrail_refs:
              - DOCKER-DOC-002
              - SC-DEP-001

      - id: CMN-WF-001
        status: done
        title: Trivy ignore contract and posture-scan correctness
        overview:
          problem: >-
            Per-image docker/ci-lint/.trivyignore.yaml and
            docker/ci-supply-chain/.trivyignore.yaml exist but are never passed to
            container-scan.yml. The root .trivyignore.yaml is applied implicitly by
            the empty-ignorefile fallback, so scan-posture jobs labelled as running
            without an ignorefile silently suppress 20+ CVEs.
          goal: >-
            Delete the root union ignorefile, pass per-image ignorefiles on blocking
            scan jobs, and set ignorefile: none on both scan-posture jobs (requires
            containerdevops ≥ 2.2.0). Document the contract in workflows.md.
        architecture:
          target: ci-*-image.yml scan jobs + ignorefiles + workflows.md
          modules:
            - .github/workflows/ci-lint-image.yml
            - .github/workflows/ci-supply-chain-image.yml
            - docker/ci-lint/.trivyignore.yaml
            - docker/ci-supply-chain/.trivyignore.yaml
            - .trivyignore.yaml
            - docs/workflows.md
        acceptance_criteria:
          - Blocking scan jobs pass per-image ignorefile paths
          - Both scan-posture jobs set ignorefile: none
          - Root .trivyignore.yaml removed
          - workflows.md documents the ignorefile contract
        guardrail_refs:
          - DOCKER-SEC-001
        tasks:
          - id: CMN-WF-001-T1
            status: done
            title: Delete root ignorefile and wire per-image ignorefiles on blocking scans
            instructions:
              files:
                - .trivyignore.yaml
                - .github/workflows/ci-lint-image.yml
                - .github/workflows/ci-supply-chain-image.yml
            verification:
              - test ! -f .trivyignore.yaml
              - rg -n "ignorefile: docker/ci-lint" .github/workflows/ci-lint-image.yml
              - rg -n "ignorefile: docker/ci-supply-chain" .github/workflows/ci-supply-chain-image.yml
            guardrail_refs:
              - DOCKER-SEC-001
          - id: CMN-WF-001-T2
            status: done
            title: Set ignorefile none on both scan-posture jobs
            instructions:
              files:
                - .github/workflows/ci-lint-image.yml
                - .github/workflows/ci-supply-chain-image.yml
            verification:
              - rg -n "ignorefile: none" .github/workflows/ci-lint-image.yml
              - rg -n "ignorefile: none" .github/workflows/ci-supply-chain-image.yml
          - id: CMN-WF-001-T3
            status: done
            title: Document ignorefile contract in workflows.md
            instructions:
              files:
                - docs/workflows.md
            verification:
              - grep -q "ignorefile: none" docs/workflows.md

      - id: CMN-WF-002
        status: done
        title: Release-token contract and real published-image rescan
        overview:
          problem: >-
            common-release.yml creates releases with github.token; GITHUB_TOKEN-created
            releases do not fire the release event, so consumers relying on that chain
            silently skip publish. No release_token secret exists and workflows.md is
            silent. devops-security.yml published-image-rescan is a no-op heredoc.
          goal: >-
            Add optional release_token secret with a diagnostic warning; document the
            event-chain limitation; replace the no-op with a real registry pull-and-scan
            of ci-lint and ci-supply-chain via containerdevops container-scan.yml.
        architecture:
          target: common-release.yml + devops-security.yml + workflows.md
          modules:
            - .github/workflows/common-release.yml
            - .github/workflows/devops-security.yml
            - docs/workflows.md
        acceptance_criteria:
          - common-release.yml has optional release_token secret and warns when falling back
          - workflows.md documents the PAT requirement for release-event workflows
          - devops-security.yml rescans ghcr.io/pirlruc/ci-lint:latest and ci-supply-chain:latest
          - actionlint passes on both workflows
        guardrail_refs:
          - CI-024
          - CI-025
        tasks:
          - id: CMN-WF-002-T1
            status: done
            title: Add release_token secret and event-chain warning
            instructions:
              files:
                - .github/workflows/common-release.yml
                - docs/workflows.md
            verification:
              - grep -q "release_token" .github/workflows/common-release.yml
              - grep -q "release_token" docs/workflows.md
              - actionlint .github/workflows/common-release.yml
            guardrail_refs:
              - CI-024
          - id: CMN-WF-002-T2
            status: done
            title: Implement real published-image registry rescan
            instructions:
              files:
                - .github/workflows/devops-security.yml
            verification:
              - "! grep -q 'Note — published image rescan' .github/workflows/devops-security.yml"
              - grep -q "ci-lint:latest" .github/workflows/devops-security.yml
              - actionlint .github/workflows/devops-security.yml
            guardrail_refs:
              - CI-025

      - id: CMN-SC-001
        status: done
        title: Supply-chain install hardening, pin hygiene, and reviewer prompt
        overview:
          problem: >-
            install-common-tools.sh pipes actionlint from main and verifies no SHA256
            digests. ci-*-image.yml still pin containerdevops at 2.1.0 and declare a dead
            CONTAINERDEVOPS_PIN env. The continuous-improvement prompt allowed the
            ai-reviewer to infer companion-repo permissions instead of reading the file.
          goal: >-
            Mirror containerdevops install hardening; re-pin to containerdevops 2.2.0 and
            remove the dead env; tighten the continuous-improvement prompt to require
            verifying claims against the referenced file contents.
        architecture:
          target: install-common-tools.sh + image callers + continuous-improvement.md
          modules:
            - scripts/install-common-tools.sh
            - .github/workflows/ci-lint-image.yml
            - .github/workflows/ci-supply-chain-image.yml
            - docs/continuous-improvement.md
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - actionlint installs via versioned tarball with SHA256 verification
          - All containerdevops uses:/scripts_ref pairs pin 2.2.0 SHA
          - CONTAINERDEVOPS_PIN env removed
          - continuous-improvement.md requires reading referenced files before claiming
        guardrail_refs:
          - SC-DEP-001
        tasks:
          - id: CMN-SC-001-T1
            status: done
            title: Add SHA256 verification and actionlint tarball to install-common-tools.sh
            instructions:
              files:
                - scripts/install-common-tools.sh
            verification:
              - "! grep -q download-actionlint.bash scripts/install-common-tools.sh"
              - grep -q sha256sum scripts/install-common-tools.sh
              - shellcheck scripts/install-common-tools.sh
          - id: CMN-SC-001-T2
            status: done
            title: Re-pin containerdevops to 2.2.0 and remove dead CONTAINERDEVOPS_PIN
            instructions:
              files:
                - .github/workflows/ci-lint-image.yml
                - .github/workflows/ci-supply-chain-image.yml
            verification:
              - "! grep -q CONTAINERDEVOPS_PIN .github/workflows/ci-lint-image.yml"
              - grep -q 0fb7bab3411a6756911debce0624061d60537a33 .github/workflows/ci-lint-image.yml
              - grep -q 0fb7bab3411a6756911debce0624061d60537a33 .github/workflows/ci-supply-chain-image.yml
            guardrail_refs:
              - SC-DEP-001
          - id: CMN-SC-001-T3
            status: done
            title: Require file-backed verification in continuous-improvement prompt
            instructions:
              files:
                - docs/continuous-improvement.md
                - docs/ai-agent-handoff.md
            verification:
              - grep -qi "referenced file\|do not infer\|verify.*against" docs/continuous-improvement.md

      - id: CMN-IMG-001
        status: open
        title: Alpine 3.24 variant for ci-supply-chain
        overview:
          problem: >-
            ci-supply-chain ships only on debian13 DHI. Alpine 3.24 DHI bases and
            syft/grype/trivy donors currently show fewer OS findings, but there is no
            published Alpine lane or variant tagging contract.
          goal: >-
            Add Dockerfile.alpine, parallel build/scan/publish jobs with distinct
            artifact and SARIF names, tag_suffix -alpine/-debian with Alpine owning
            unsuffixed tags, and record the Alpine size deviation.
        architecture:
          target: docker/ci-supply-chain + ci-supply-chain-image.yml
          modules:
            - docker/ci-supply-chain/Dockerfile.alpine
            - .github/workflows/ci-supply-chain-image.yml
            - scripts/pin-dhi-digests.sh
            - docs/guardrail-deviations.yml
            - docs/docker-hub-ci-supply-chain.md
