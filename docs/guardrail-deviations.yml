# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.8.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Size is measured as uncompressed rootfs via `du -sxm /` inside the image
# (scripts/check-image-size.sh in containerdevops). Do not use docker inspect
# .Size — that field is store-dependent.

deviations:
  # DOCKER-PERF-001 image_max_size_mb deviations retired: ci-lint and
  # ci-supply-chain are CI toolchain images and use ci_image_max_size_mb (2000)
  # via size_class=ci_toolchain (DOCKER-PERF-002 / CMN-PIN-001).
  - id: SC-SIGN-001
    why: >-
      The repository returns to private on the Free plan, where Sigstore
      keyless signing is unavailable. Publish sets sign from repository
      visibility, so a private repo stays unsigned. Documented Free-plan
      pattern in guardrails 1.9.0 supply-chain/guardrails.md.
    epic: CMN-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: SC-PROV-001
    why: >-
      The repository returns to private on the Free plan, where provenance
      attestation is unavailable. Publish keeps provenance and sbom false
      unless sign is true, which follows repository visibility (guardrails 1.9.0).
    epic: CMN-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: CI-032
    why: >-
      A user-owned private repository on GitHub Free cannot protect the
      default branch or tags. Callers pin this repo by commit SHA (CI-018).
      Do not add a ruleset that only exists while the repository is public.
    epic: CMN-PIN-019
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: REL-PUB-004
    why: >-
      GitHub Environments restricted to tag refs are not available on a
      private Free-plan user repository. Publish tokens stay in repository
      secrets.
    epic: CMN-PIN-019
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: SC-DEP-003
    why: >-
      Dependabot ignores dhi.io python images >= 3.14. PY-RUN-003 keeps
      Python 3.13 until the 2027-04 re-evaluation. Patch updates on 3.13
      still apply.
    epic: CMN-PIN-019
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2027-04-30
