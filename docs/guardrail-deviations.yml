# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.6.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Size is measured as uncompressed rootfs via `du -sxm /` inside the image
# (scripts/check-image-size.sh in containerdevops). Do not use docker inspect
# .Size — that field is store-dependent.

deviations:
  # DOCKER-PERF-001 image_max_size_mb deviations retired: ci-lint and
  # ci-supply-chain are CI toolchain images and use ci_image_max_size_mb (2000)
  # via size_class=ci_toolchain (DOCKER-PERF-002 / CMN-PIN-001).
  - id: SC-SIGN-001
    why: >-
      Private Free-plan repository; Sigstore keyless signing is unavailable.
      Publish sets sign=false until the repo is public or a signing key is
      provisioned. Documented Free-plan pattern in guardrails 1.8.0
      supply-chain/guardrails.md.
    epic: CMN-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: SC-PROV-001
    why: >-
      Private Free-plan repository; provenance attestation is unavailable.
      container-publish.yml keeps provenance: false / sbom: false on
      build-push-action; actions/attest-build-provenance runs only when sign
      is true (public repos).
    epic: CMN-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
