# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.5.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Size is measured as uncompressed rootfs via `du -sxm /` inside the image
# (scripts/check-image-size.sh in containerdevops). Do not use docker inspect
# .Size — that field is store-dependent.

deviations:
  # DOCKER-PERF-001 image_max_size_mb deviations retired: ci-lint and
  # ci-supply-chain are CI toolchain images and use ci_image_max_size_mb (2000)
  # via size_class=ci_toolchain (DOCKER-PERF-002 / CMN-PIN-001).
  - id: REL-CHG-001
    key: changelog_required
    org_default: true
    repo_value: false
    why: >-
      Release-notes-only ops repo; GitHub Releases carry the notes. Guardrails
      GR-CHG-001 is open to clarify changelog_required for this case.
    epic: CMN-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
